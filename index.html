            { n: 5, c: 'tip', g: '模組一：後端 Code.gs 與試算表資料庫', t: '選單 ⓪～④：老師的「設定順序」', b: '這五個選單的編號，本身就是引導老師完成初次設定的流程，不會漏掉步驟。它們同樣要用函式名稱綁定（見卡片 #4）。', see: '照編號由上往下點就對了：⓪ 檢查試算表與資料夾 ID → ① 貼上 Gemini API Key → ② 建立設定分頁與題庫 → ③ 測試連線、看可用模型 → ④ 檢查題庫並建立各單元作答分頁。' },
            { n: 6, c: 'core', g: '模組一：後端 Code.gs 與試算表資料庫', t: '把 Google 試算表當資料庫：三種分頁', b: '⚙️系統設定（模型、批改間隔、是否自動公開、網頁標題）、⚙️批改規準（舊版相容用）、⚙️題庫（每個單元的題目與解答），再加上依單元動態建立的「學生作答分頁」。沒有就自動建立並填入預設值。' },
            { n: 7, c: 'guard', g: '模組一：後端 Code.gs 與試算表資料庫', t: '預設模型指定為 gemini-3.5-flash-lite', b: '只是一個設定值，但低階 AI 很容易寫錯。', bad: 'AI 可能自己挑舊模型或根本不存在的模型名稱，API 一呼叫就失敗。', fix: '把預設模型名稱寫死在設定分頁的預設值裡，老師之後仍可自行修改。' },
            { n: 8, c: 'guard', g: '模組一：後端 Code.gs 與試算表資料庫', t: '欄位順序「一字不差」', b: '試算表就是資料庫，欄位順序就是資料庫的結構定義。', bad: '前後端對欄位位置的認知不同，批改結果會寫到錯的欄、查詢成績時也會讀到錯的欄。', fix: '明確寫出「題庫 11 個欄位」與「作答分頁第 1～8 欄」的順序，前後端都照這份清單讀寫。' },
            { n: 9, c: 'core', g: '模組一：後端 Code.gs 與試算表資料庫', t: '✨ 依學科本質，自動生成 0分／一半／全部 三等級規準', b: '不同科目看重的東西不同：理科看邏輯推演與變因控制、文科看文本脈絡與論述、社會看史地因果。AI 先讀「年級與學科」，拆出 2～3 個評量面向，每個面向都寫出三個得分等級（０分、一半、全部），滿分 10 分，讓老師一鍵產出專業規準。' },
            { n: 10, c: 'core', g: '模組一：後端 Code.gs 與試算表資料庫', t: '▶️ 自動批改：Gemini Vision 看手寫圖，依規準給分', b: '讀取學生作答的圖片（Base64），交給 Gemini Vision，並要求 AI 依據上一步產生的三等級規準給分。回傳格式與寫入位置的細節，見下方黃色卡片。' },
            { n: 11, c: 'guard', g: '模組一：後端 Code.gs 與試算表資料庫', t: '強制回傳 JSON，並指定欄位名稱', b: '另外要搭配最後一張卡片，避免 JSON 外面的 Markdown 標記造成解析錯誤。', bad: 'AI 如果用一般文字回覆，程式沒辦法穩定取出分數與回饋，解析常常失敗。', fix: '規定回傳 JSON，並列出欄位名稱（is_blank、q1_score、q1_feedback、q2_score、q2_feedback、encouragement、confidence、teacher_note），程式才能固定去讀。' },
            { n: 12, c: 'guard', g: '模組一：後端 Code.gs 與試算表資料庫', t: '批改結果寫回「指定欄位」', b: '讓「批改」與「查詢」兩邊讀寫同一份欄位。', bad: '沒指定位置時，AI 會自己決定寫到哪一欄，與前面欄位規格、查詢功能對不上。', fix: '明講：回饋與鼓勵 → 第 5 欄；q1＋q2 → 第 6 欄；狀態 → 第 7 欄；自動公開為「是」時，狀態寫成 ✅已公開。' },
            { n: 13, c: 'guard', g: '模組一：後端 Code.gs 與試算表資料庫', t: '3.5 分鐘超時中斷 ＋ 自動接續批改', b: '突破 GAS 的執行時間限制。', bad: 'GAS 單次執行上限約 6 分鐘，一次批改全班作業很容易做到一半被系統強制中止。', fix: 'AI 要在 3.5 分鐘時主動停下來，並建立 Time-driven trigger（continueGradingJob）接續批改；選單裡另有「停止自動接續批改」可以喊停。' },
            { n: 14, c: 'guard', g: '模組二：前端 Index.html 與畫布', t: '一律用 callBackend 封裝，並掛上 withFailureHandler', b: '失敗時要怎麼讓使用者知道，見綠色卡片 #15。', bad: 'AI 常只寫成功處理。授權被擋或後端出錯時，前端完全不知道，畫面就一直停在載入中。', fix: '統一用 callBackend(methodName, args, onSuccess, onFailure)，並規定 google.script.run 一定要同時接 withSuccessHandler 與 withFailureHandler。' },
            { n: 15, c: 'tip', g: '模組二：前端 Index.html 與畫布', t: '失敗時，用橫幅把錯誤告訴使用者，並解開按鈕', b: '這是前端「對使用者說話」的部分；為什麼要這樣做，見黃色卡片 #14。', see: '萬一授權被擋、忘了設定 SHEET_ID 或伺服器出錯，畫面上方會出現狀態橫幅，直接寫出錯誤訊息，按鈕也會恢復可按，不會一直卡在「正在載入題庫…」。' },
            { n: 16, c: 'guard', g: '模組二：前端 Index.html 與畫布', t: '圖片 onerror 自動隱藏，避免破圖', b: '細節，但學生看到會覺得系統壞掉。', bad: '題庫圖片網址失效或沒有權限時，畫面會出現難看的破圖圖示。', fix: '所有題庫的 <img> 都加上 onerror，圖片載入失敗就自動把外層容器隱藏。' },
            { n: 17, c: 'core', g: '模組二：前端 Index.html 與畫布', t: '預覽模擬版（Mock Mode）：還沒部署也能試玩', b: '偵測 google.script.run 不存在時，自動切換成預覽模式，內建數學、自然、社會三題範例；部署之後，這三題也是試算表「⚙️題庫」的初始範本。老師不用先部署，就能看到完整介面。' },
            { n: 18, c: 'core', g: '模組二：前端 Index.html 與畫布', t: 'Canvas 畫布六大工具', b: '每一題各有一塊畫布（預設高 400px）：手寫畫筆、插入文字、上傳圖片註記、增加畫布空間、復原上一步、送出合成（兩塊畫布拼成一張長圖，存到雲端硬碟）。其中最容易寫壞的兩處，見下方黃色卡片。' },
            { n: 19, c: 'guard', g: '模組二：前端 Index.html 與畫布', t: '「插入文字」要自己寫自動折行', b: '屬於紫色卡片 #18 的細節。', bad: 'Canvas 的 fillText 不會自動換行，AI 若沒被特別要求，長句會直接衝出畫布右邊。', fix: '要求根據畫布寬度寫出折行算法。' },
            { n: 20, c: 'guard', g: '模組二：前端 Index.html 與畫布', t: '增加畫布高度前，先用 tempCanvas 備份像素', b: '這是 HTML5 Canvas 最著名的陷阱之一，所以用【核心技術】標示。', bad: '只要修改 canvas.height，整張畫布的像素會瞬間歸零，學生辛苦寫的筆跡全部消失。', fix: '先建立 tempCanvas 備份現有內容，改高度、填白底後，再把 tempCanvas 貼回。' },
            { n: 21, c: 'core', g: '模組二：前端 Index.html 與畫布', t: '學生端「🔍 查詢成績」雙模式 ＋ queryStudent', b: '前端頂部要有「📝 開始作答」與「🔍 查詢成績與詳解」兩個切換按鈕；後端 queryStudent(單元, 座號, 姓名) 負責找出該生的批改結果，前端再顯示狀態徽章、總分與各題配分、AI／老師回饋、標準詳解與原手寫圖片。' },
            { n: 22, c: 'guard', g: '模組二：前端 Index.html 與畫布', t: '查詢規則：由下往上找、優先已公開、精準讀欄位', b: '對應紫色卡片 #21。', bad: '沒寫清楚時，AI 常抓到最舊一筆、或抓到尚未公開的批改，或讀錯欄位，學生會看到錯誤的分數。', fix: '規定：由下往上搜尋；座號去掉前導 0 再比對；優先挑「批改狀態」以 ✅ 開頭的最新一筆；沒有才回傳最新送出的。並指定讀第 1、4、5、6 欄，圖片由後端轉成 Base64 DataURL 回傳（不必公開分享），已公開時再附上題庫第 10 欄的標準詳解。' },
            { n: 23, c: 'guard', g: '模組三：防呆機制', t: '用 \\x60 取代反引號，避免 SyntaxError', b: '這條規則是專為「AI 在聊天室貼程式碼」這個情境設計的。', bad: '後端要清掉 Gemini 回傳的 Markdown 標記（連續三個反引號）時，若直接寫出三個反引號，會與聊天室的程式碼區塊符號衝突，導致程式碼被截斷、在 1000 多行處報語法錯誤。', fix: '強制規定 Regex 裡的反引號一律寫成十六進位的 \\x60。' }
        ];
        const P2_CARD_BY_N = Object.fromEntries(P2_CARDS.map(c => [c.n, c]));

        // 行內渲染：`code`、**粗體**、[[n|標註]]
        const p2Inline = (s, filter, active) => {
            const fmt = (t) => esc(t)
                .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-100 text-pink-700 text-[0.85em] font-mono break-all">$1</code>')
                .replace(/\*\*(.+?)\*\*/g, '<strong class="text-slate-900">$1</strong>');
            let out = ''; let last = 0; const re = /\[\[(\d+)\|([\s\S]*?)\]\]/g; let m;
            while ((m = re.exec(s))) {
                out += fmt(s.slice(last, m.index));
                const n = +m[1]; const cat = P2_CAT[P2_CARD_BY_N[n].c];
                const on = filter === 'all' || filter === P2_CARD_BY_N[n].c;
                out += on
                    ? `<span data-p2n="${n}" class="highlight-base ${cat.hl} ${active === n ? 'ring-2 ring-offset-1 ring-indigo-500' : ''}" style="cursor:pointer;display:inline"><span class="inline-flex items-center justify-center min-w-[1.2rem] h-[1.2rem] px-1 mr-1 rounded text-[10px] font-extrabold text-white ${cat.badge}">${n}</span>${fmt(m[2])}</span>`
                    : `<span class="opacity-50">${fmt(m[2])}</span>`;
                last = m.index + m[0].length;
            }
            return out + fmt(s.slice(last));
        };


        // ================= 共用小元件（沿用模板樣式） =================
        const CopyBtn = ({ id, text, copied, onCopy, label = '複製此段' }) => (
            <button type="button" onClick={(e) => onCopy(e, id, text)} className={`flex items-center text-xs px-3 py-1.5 rounded-md border shadow-sm transition-colors shrink-0 ${copied ? 'bg-green-50 text-green-600 border-green-200' : 'bg-gray-100 hover:bg-indigo-50 text-gray-700 border-gray-200'}`}>
                {copied ? <IconCheckCircle2 className="w-4 h-4 mr-1" /> : <IconCopy className="w-4 h-4 mr-1" />}
                <span>{copied ? '已複製！' : label}</span>
            </button>
        );

        const IpLine = () => (
            <div className="mb-3 flex justify-end">
                <span className="text-xs font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-pink-500 to-purple-600 animate-pulse tracking-wide drop-shadow-sm">⚠️ 請尊重智慧財產，使用請引註，Prompt 模板來源：優履團隊</span>
            </div>
        );

        const PromptBlock = ({ id, tag, chip, html, raw, active, onSelect, copied, onCopy }) => (
            <div className={`prompt-block bg-white p-5 rounded-xl cursor-pointer ${active ? 'active' : ''}`} onClick={() => onSelect(id)}>
                <div className="flex justify-between items-start gap-2 mb-3">
                    <span className={`px-2 py-1 ${chip} text-xs font-bold rounded`}>{tag}</span>
                    <CopyBtn id={'copy-' + id} text={raw} copied={copied} onCopy={onCopy} />
                </div>
                <IpLine />
                <div className="text-gray-800 leading-relaxed text-sm break-words" dangerouslySetInnerHTML={{ __html: html }}></div>
            </div>
        );

        const SectionHeader = ({ n, tone, children, first }) => {
            const T = { indigo: ['border-indigo-200', 'text-indigo-900', 'bg-indigo-600'], orange: ['border-orange-200', 'text-orange-900', 'bg-orange-500'], purple: ['border-purple-200', 'text-purple-900', 'bg-purple-600'], teal: ['border-teal-200', 'text-teal-900', 'bg-teal-600'], emerald: ['border-emerald-200', 'text-emerald-900', 'bg-emerald-600'], rose: ['border-rose-200', 'text-rose-900', 'bg-rose-600'] }[tone];
            return (
                <div className={`border-b-2 ${T[0]} pb-2 mb-4 ${first ? '' : 'mt-10'}`}>
                    <h2 className={`text-2xl font-extrabold ${T[1]} flex items-center`}>
                        <span className={`${T[2]} text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm shrink-0`}>{n}</span>
                        {children}
                    </h2>
                </div>
            );
        };

        // 右側深色解析面板（與模板 renderAnalysisPanel 相同）
        const AnalysisPanel = ({ data, Icon, iconColor, title }) => (
            <div className="w-full md:w-1/3 h-2/5 md:h-auto bg-gray-900 text-gray-100 flex flex-col shadow-2xl relative z-20 border-l border-gray-700">
                <div className="p-6 border-b border-gray-800 bg-gray-900 flex-shrink-0">
                    <h2 className="text-xl font-bold text-white flex items-center"><Icon className={`w-6 h-6 mr-2 ${iconColor}`} />{title}</h2>
                    <p className="text-gray-400 text-sm mt-2">點擊左側段落即可查看專屬解析與應用建議。</p>
                </div>
                <div className="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar">
                    {data ? (
                        <div key={data.title} className="animate-fade-in">
                            <p className="text-white font-bold mb-3">{data.title}</p>
                            <div className="bg-gray-800 rounded-lg p-5 border border-gray-700 shadow-inner">
                                <h3 className="text-indigo-300 font-bold text-sm uppercase tracking-wider mb-2">結構分析</h3>
                                <p className="text-gray-200 leading-relaxed text-sm [&_code]:text-pink-300 [&_code]:font-mono" dangerouslySetInnerHTML={{ __html: data.structure }}></p>
                            </div>
                            <div className="bg-gray-800 rounded-lg p-5 border border-gray-700 shadow-inner mt-4">
                                <h3 className="text-green-400 font-bold text-sm uppercase tracking-wider mb-3">老師可以這樣做</h3>
                                <div className="text-gray-200 text-sm leading-relaxed space-y-2 [&_code]:text-pink-300 [&_code]:font-mono" dangerouslySetInnerHTML={{ __html: data.customization }}></div>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center text-gray-500 mt-20"><IconLightbulb className="w-16 h-16 mx-auto mb-4 opacity-50" /><p>請點擊左方提示詞區塊開始解析</p></div>
                    )}
                </div>
            </div>
        );

        const jumpTo = (id) => { const el = document.getElementById(id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('ring-4', 'ring-amber-300', 'rounded-xl'); setTimeout(() => el.classList.remove('ring-4', 'ring-amber-300', 'rounded-xl'), 1800); } };
        // 階段流程（沿用模板 StageFlow 樣式）
        const StageFlow = ({ stages }) => (
            <div className="grid grid-cols-2 md:grid-cols-[1fr_auto_1fr_auto_1fr_auto_1fr] items-stretch gap-2 md:gap-1">
                {stages.map(([t, d, tag, link, linkLabel], i) => (
                    <React.Fragment key={t}>
                        <button type="button" onClick={() => link && jumpTo(link)} title={link ? `跳到${linkLabel}` : undefined}
                            className={`text-left rounded-lg border-2 px-3 py-2 flex items-center gap-2 transition-all ${STAGE_TONES[i].box} ${link ? 'hover:-translate-y-0.5 hover:shadow-md cursor-pointer' : 'cursor-default'}`}>
                            <span className="shrink-0 [&_svg]:w-7 [&_svg]:h-7"><StageIcon n={i} /></span>
                            <span className="min-w-0 flex-1">
                                <span className="flex items-center gap-1.5"><span className={`font-extrabold ${STAGE_TONES[i].title}`}>{t}</span><span className={`text-[11px] font-bold px-1.5 py-0.5 rounded ${STAGE_TONES[i].tag}`}>{tag}</span></span>
                                <span className="block text-xs text-slate-600 leading-tight mt-0.5">{d}</span>
                                {link && <span className="block text-[11px] font-bold text-amber-700 mt-1 underline decoration-dotted underline-offset-2">↓ {linkLabel}</span>}
                            </span>
                        </button>
                        {i < 3 && <div className="hidden md:flex items-center text-slate-300 text-lg font-bold" aria-hidden="true">→</div>}
                    </React.Fragment>
                ))}
            </div>
        );

        // ================= Part 1 解析資料 =================
        const tipsHtml = (tips, color) => tips.map(t => `<div class="mb-3 border-l-4 border-${color}-400 pl-3">👉 ${t}</div>`).join('');
        const P1_ANALYSIS = {};
        ['step1', 'step2', 'step3'].forEach(k => STAGES[k].blocks.forEach(b => {
            P1_ANALYSIS[b.id] = { title: b.tag, structure: b.structure, customization: tipsHtml(b.tips, { indigo: 'yellow', orange: 'orange', purple: 'purple' }[STAGES[k].tone]) };
        }));
        const P1_TONE_CHIP = { indigo: 'bg-indigo-100 text-indigo-800', orange: 'bg-orange-100 text-orange-800', purple: 'bg-purple-100 text-purple-800' };

        // ================= Part 2 解析資料 =================
        const P2L = P2_RAW.split('\n');
        const P2_BLOCKS = [
            { sec: 1, id: 'p2-0', tag: '🔷 角色設定：目標與雙檔案架構', lines: [2, 3], cards: [1, 2], s: '先給 AI 一個「GAS 全端教育科技工程師」的角色，再一句話講清楚要做什麼系統、要交出 <code>Code.gs</code>（後端）與 <code>Index.html</code>（前端）兩個檔案，並要求完整、可直接執行。後面所有規格都掛在這兩個檔案底下。' },
            { sec: 2, id: 'p2-1', tag: '🔷 試算表選單「🤖 AI 批改」', lines: [5, 21], cards: [3, 4, 5], s: '老師不用進 GAS 後台，所有操作都在試算表上方的選單完成。每一個選單文字都用 <code>-></code> 綁定指定的函式名稱；⓪～④ 的編號本身就是初次設定的順序。' },

            ], tips: ['每個單元的年級與 Q1、Q2 名稱也是必改，要和單元名稱一起換。', '圖片網址可以先保留範例，之後再到試算表的 ⚙️題庫 換掉。'] },
            'p2-6': { ideas: [
                ['平板直式作答', '畫布預設高度改成 600px，寫長算式比較不用一直加長。', { p2h: '600px' }],
                ['每次加長多一點', '「增加畫布空間」改成每次 400px。', { p2add: '400px' }]
            ], tips: [] },
            'wu-0': { ideas: [
                ['校內週三進修', '使用情境改成「校內週三進修開場」，活動名稱改成「週三進修・簽到牆」。', { wuctx: '校內週三進修開場', wutitle: '週三進修・簽到牆' }],
                ['開學第一天', '對象改成「同學」，活動名稱改成「開學第一天・自我介紹牆」。', { wuctx: '班級開學第一天', wutitle: '開學第一天・自我介紹牆', wuwho: '同學', wuwho2: '同學' }],
                ['親師座談', '對象改成「家長」，活動名稱改成「親師座談・留言牆」。', { wuctx: '親師座談會', wutitle: '親師座談・留言牆', wuwho: '家長', wuwho2: '家長' }]
            ], tips: ['「使用對象」改了，模組二大螢幕的「已有 N 位◯◯畫押」也要跟著改。'] },
            'wu-1': { ideas: [
                ['選單換名字', '例如「🖐️ 簽到牆」，和活動名稱一致。', { wumenu: '🖐️ 簽到牆' }]
            ], tips: [] },
            'wu-2': { ideas: [
                ['人多時加快輪播', '30 人以上，作品每張停 5 秒、每播 4 張插一次邀請頁。', { wucard: '5', wuevery: '4' }],
                ['開場前強調加入課程', '每播 1 張就插一次邀請頁，邀請頁停 15 秒。', { wuevery: '1', wuinv: '15' }]
            ], tips: ['這些只是「預設值」，部署後也能直接在 ⚙️系統設定 改，不用重新部署。'] },
            'wu-3': { ideas: [
                ['學生使用', '學生容易連按，冷卻時間改成 15 秒。', { wucd: '15' }]
            ], tips: [] },
            'wu-5': { ideas: [
                ['低年級學生', '心情最多 30 字、名字最多 8 字，版面更清爽。', { wumood: '30', wuname: '8' }]
            ], tips: [] },
            'wu-6': { ideas: [
                ['改成 LINE 群組', '邀請頁改成「加入 LINE 社群」，截圖換成群組 QR Code 的畫面。', { wuinvite: '加入 LINE 社群' }],
                ['改成 Google Meet', '邀請頁改成「加入 Google Meet」，代碼欄放會議代碼。', { wuinvite: '加入 Google Meet' }]
            ], tips: ['「使用對象」改了，模組二「已有 N 位◯◯畫押」也要一起改。'] }
        };

        // 欄位：點一下直接改（失焦時存檔，Enter 完成，Esc 取消）
        const EditField = ({ k, def, val, dim, onCommit }) => {
            const m = metaOf(k); const K = ED_KIND[m.k];
            const v = val !== undefined ? val : def;
            const changed = val !== undefined && val !== def;
            const hint = m.f ? `${K.tip}；要和「${m.g}」相關的地方一起改` : K.tip;
            return (
                <span className={`whitespace-normal ${dim ? 'opacity-35' : ''}`}>
                    <span key={k + ':' + v} contentEditable={!dim} suppressContentEditableWarning spellCheck={false} title={`${K.icon} ${K.name}：${hint}`}
                        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } if (e.key === 'Escape') { e.currentTarget.textContent = v; e.currentTarget.blur(); } }}
                        onBlur={(e) => onCommit(k, e.currentTarget.textContent.replace(/\s+/g, ' ').trim())}
                        className={`ed-field ${changed ? 'ed-changed' : ''}`}>{v}</span>
                    <span className={`ed-pill ${K.pill}`} title={hint}>{K.icon} {K.name}</span>
                </span>
            );
        };

        // 行內：[[n|標註]]、{{欄位}}、**粗體**、`程式碼`
        const ED_INL = /\[\[(\d+)\|([\s\S]*?)\]\]|\{\{(\w+)\|([^}]*)\}\}|\*\*(.+?)\*\*|`([^`]+)`/g;
        const edFieldsOnly = (s, ctx, kb) => {
            const out = []; let last = 0; let m; const re = new RegExp(ED_RE.source, 'g'); let n = 0;
            while ((m = re.exec(s))) {
                if (m.index > last) out.push(s.slice(last, m.index));
                out.push(<EditField key={kb + 'f' + (n++)} k={m[1]} def={m[2]} val={ctx.vals[m[1]]} dim={ctx.dim(m[1])} onCommit={ctx.commit} />);
                last = m.index + m[0].length;
            }
            if (last < s.length) out.push(s.slice(last));
            return out;
        };
        const edInline = (s, ctx, kb = 'i') => {
            const out = []; let last = 0; let m; let n = 0; const re = new RegExp(ED_INL.source, 'g');
            while ((m = re.exec(s))) {
                if (m.index > last) out.push(s.slice(last, m.index));
                const key = kb + '-' + (n++);
                if (m[1]) {
                    const c = ctx.cards && ctx.cards[+m[1]];
                    const cat = c ? P2_CAT[c.c] : null;
                    out.push(cat
                        ? <span key={key} className={`highlight-base ${cat.hl}`} style={{ display: 'inline' }}><span className={`inline-flex items-center justify-center min-w-[1.2rem] h-[1.2rem] px-1 mr-1 rounded text-[10px] font-extrabold text-white ${cat.badge}`}>{m[1]}</span>{edInline(m[2], ctx, key)}</span>
                        : <span key={key}>{edInline(m[2], ctx, key)}</span>);
                } else if (m[3]) {
                    out.push(<EditField key={key} k={m[3]} def={m[4]} val={ctx.vals[m[3]]} dim={ctx.dim(m[3])} onCommit={ctx.commit} />);
                } else if (m[5] !== undefined) {
                    out.push(<strong key={key} className="text-slate-900">{edInline(m[5], ctx, key)}</strong>);
                } else {
                    out.push(<code key={key} className="px-1 py-0.5 rounded bg-slate-100 text-pink-700 text-[0.85em] font-mono break-all">{edFieldsOnly(m[6], ctx, key)}</code>);
                }
                last = m.index + m[0].length;
            }
            if (last < s.length) out.push(s.slice(last));
            return out;
        };
        // 逐行：標題、清單、程式碼區塊
        const edLines = (lines, ctx, style) => {
            const out = []; let inCode = false; let code = [];
            lines.forEach((raw, i) => {
                const key = 'l' + i;
                if (raw.trim().startsWith('```')) {
                    if (inCode) { out.push(<pre key={key} className="my-2 p-3 rounded-lg bg-slate-900 text-slate-100 text-xs leading-relaxed overflow-x-auto font-mono">{code.join('\n')}</pre>); code = []; }
                    inCode = !inCode; return;
                }
                if (inCode) { code.push(raw.replace(/^ {4}/, '')); return; }
                if (!raw.trim() || raw.trim() === '---') return;
                const h = raw.match(/^(#{2,4})\s+(.*)$/);
                if (h) { out.push(<p key={key} className="mt-3 mb-1 font-extrabold text-slate-800">{edInline(h[2], ctx, key)}</p>); return; }
                if (raw.startsWith('##')) { out.push(<p key={key} className="mt-1 mb-2 font-bold text-slate-600 border-b border-dashed border-slate-300 pb-1">{edInline(raw.slice(2), ctx, key)}</p>); return; }
                const li = raw.match(/^(\s*)(-|\d+\.)\s+(.*)$/);
                if (li) {
                    const lv = style === 'p2' ? (li[1].length >= 2 ? 1 : 0) : Math.min(3, Math.floor(li[1].length / 2));
                    const bullet = style === 'p2' ? (/\d/.test(li[2]) ? li[2] : lv ? '◦' : '•') : '•';
                    out.push(<div key={key} className="flex gap-2 my-1" style={{ paddingLeft: (lv * (style === 'p2' ? 1.2 : 1.1)) + 'rem' }}><span className="text-slate-400 shrink-0">{bullet}</span><span className="min-w-0">{edInline(li[3], ctx, key)}</span></div>);
                    return;
                }
                out.push(<p key={key} className="my-1">{edInline(raw.trim(), ctx, key)}</p>);
            });
            return out;
        };

        // 一個提示詞（P1／P2／開場）的資料
        const edPrompt = (raw, blocks, style, cards, tagOf) => {
            const lines = raw.split('\n');
            const defs = edDefaults(raw);
            const keys = Object.keys(defs);
            const bk = {};
            blocks.forEach(b => { bk[b.id] = edKeysIn(lines.slice(b.lines[0] - 1, b.lines[1]).join('\n')); });
            return { raw, lines, blocks, style, cards, defs, keys, bk, tagOf: tagOf || ((b) => b.tag),
                mustKeys: keys.filter(k => metaOf(k).k === 'must') };
        };
        const edBlockSrc = (P, b) => P.lines.slice(b.lines[0] - 1, b.lines[1]).join('\n');
        const edBlockCopy = (P, b, vals, ovr) => {
            let t = ovr[b.id] !== undefined ? ovr[b.id] : edResolve(edBlockSrc(P, b), vals);
            if (P.style === 'p2') t = t.replace(/\[\[\d+\|([\s\S]*?)\]\]/g, '$1').replace(/^##/gm, '### ');
            return t;
        };
        const edFullCopy = (P, vals, ovr) => {
            const starts = {}; P.blocks.forEach(b => { starts[b.lines[0]] = b; });
            const out = []; let i = 1;
            while (i <= P.lines.length) {
                const b = starts[i];
                if (b && ovr[b.id] !== undefined) { out.push(ovr[b.id]); i = b.lines[1] + 1; continue; }
                out.push(P.lines[i - 1]); i++;
            }
            let t = edResolve(out.join('\n'), vals);
            if (P.style === 'p2') {
                t = t.split('\n').map(l => {
                    l = l.replace(/\[\[\d+\|([\s\S]*?)\]\]/g, '$1');
                    if (l.startsWith('##')) return '\n### ' + l.slice(2);
                    if (l.startsWith('#')) return '\n## ' + l.slice(1);
                    return l;
                }).join('\n').trim();
            }
            return t;
        };
        const edIsMod = (vals, defs, k) => vals[k] !== undefined && vals[k] !== defs[k];
        const edCounts = (P, vals, ovr) => {
            const mod = P.keys.filter(k => edIsMod(vals, P.defs, k)).length;
            const must = P.mustKeys.filter(k => edIsMod(vals, P.defs, k)).length;
            const rw = P.blocks.filter(b => ovr[b.id] !== undefined).length;
            return { mod, total: P.keys.length, must, mustTotal: P.mustKeys.length, rw };
        };

        // 上方工具列
        const EditToolbar = ({ id, P, counts, filter, setFilter, onResetAll, onCopyAll, copied }) => (
            <div id={id} className="sticky -top-6 z-10 -mx-6 -mt-6 px-6 pt-4 pb-3 bg-slate-50/95 backdrop-blur border-b border-slate-200 space-y-2 scroll-mt-4">
                <div className="flex flex-wrap items-center gap-2">
                    <span className="text-sm font-extrabold text-slate-800 mr-1">✏️ 修改指令</span>
                    <div className="inline-flex rounded-full border border-slate-200 bg-white p-0.5 text-xs font-bold">
                        {[['all', '全部'], ['must', '✏️ 只看必改'], ['edit', '只看可修改']].map(([v, l]) => {
                            const off = v === 'must' && !counts.mustTotal;
                            return <button key={v} type="button" disabled={off} onClick={() => setFilter(v)} title={off ? '這份指令沒有必改的地方' : ''}
                                className={`px-3 py-1 rounded-full transition-colors ${filter === v ? 'bg-violet-500 text-white' : off ? 'text-slate-300 cursor-not-allowed' : 'text-slate-600 hover:bg-slate-100'}`}>{l}</button>;
                        })}
                    </div>
                    <div className="flex flex-wrap gap-1">
                        {Object.values(ED_KIND).map(K => <span key={K.name} className={`ed-pill ${K.pill}`} title={K.tip}>{K.icon} {K.name}</span>)}
                    </div>
                    <span className="ml-auto text-xs font-bold text-slate-500 whitespace-nowrap">已修改 {counts.mod} / {counts.total} 處{counts.mustTotal ? ` · 必改 ${counts.must} / ${counts.mustTotal}` : ''}{counts.rw ? ` · 整段改寫 ${counts.rw} 段` : ''}</span>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                    <button type="button" onClick={onResetAll} className="px-3 py-1.5 rounded-full border border-slate-200 bg-white text-xs font-bold text-slate-600 hover:bg-slate-100">↺ 全部還原</button>
                    <button type="button" onClick={onCopyAll} className={`inline-flex items-center px-4 py-1.5 rounded-full text-white text-xs font-bold shadow ${copied ? 'bg-green-600' : 'bg-violet-500 hover:bg-violet-600'}`}>
                        {copied ? <IconCheckCircle2 className="w-4 h-4 mr-1" /> : <IconCopy className="w-4 h-4 mr-1" />}{copied ? '已複製（含你的修改）！' : '複製完整指令'}
                    </button>
                    <span className="text-[11px] text-slate-500">點<span className="ed-field mx-1">黃色底線</span>的文字直接改；Enter 完成、Esc 取消。修改會存在這台電腦的瀏覽器。</span>
                </div>
            </div>
        );

        // 一段指令卡片：直接改、整段改寫、還原、修改靈感
        const EditBlock = ({ P, b, chip, vals, ovr, filter, active, onSelect, commit, onOverride, onResetBlock, onInspire, copied, onCopy }) => {
            const [rw, setRw] = useState(null);
            const keys = P.bk[b.id];
            const hasMust = keys.some(k => metaOf(k).k === 'must');
            if (filter === 'must' && !hasMust) return null;
            if (filter === 'edit' && !keys.length) return null;
            const ctx = { vals, commit, cards: P.cards, dim: (k) => filter === 'must' && metaOf(k).k !== 'must' };
            const modN = keys.filter(k => edIsMod(vals, P.defs, k)).length;
            const isOvr = ovr[b.id] !== undefined;
            const copyText = edBlockCopy(P, b, vals, ovr);
            return (
                <div className={`prompt-block bg-white p-5 rounded-xl cursor-pointer ${active ? 'active' : ''}`} onClick={() => onSelect(b.id)}>
                    <div className="flex justify-between items-start gap-2 mb-3">
                        <span className={`px-2 py-1 ${chip} text-xs font-bold rounded`}>{b.tag}</span>
                        <CopyBtn id={'copy-' + b.id} text={copyText} copied={copied} onCopy={onCopy} label="複製這段" />
                    </div>
                    <IpLine />
                    {rw !== null ? (
                        <div onClick={(e) => e.stopPropagation()} className="space-y-2">
                            <p className="text-xs font-bold text-violet-700">✍️ 整段改寫：直接修改下方文字，按「儲存改寫」後，複製指令會用你的版本。</p>
                            <textarea value={rw} onChange={(e) => setRw(e.target.value)} rows={Math.min(18, Math.max(5, rw.split('\n').length + 1))}
                                className="w-full rounded-lg border-2 border-violet-300 focus:border-violet-500 outline-none p-3 text-sm leading-relaxed font-mono bg-violet-50/30" />
                            <div className="flex flex-wrap gap-2">
                                <button type="button" onClick={() => { onOverride(b.id, rw); setRw(null); }} className="px-4 py-1.5 rounded-full bg-violet-500 hover:bg-violet-600 text-white text-xs font-bold">💾 儲存改寫</button>
                                <button type="button" onClick={() => setRw(null)} className="px-4 py-1.5 rounded-full border border-slate-200 bg-white text-xs font-bold text-slate-600">取消</button>
                            </div>
                        </div>
                    ) : isOvr ? (
                        <div className="text-gray-800 leading-relaxed text-sm break-words whitespace-pre-wrap rounded-lg bg-violet-50/50 border border-dashed border-violet-300 p-3">{ovr[b.id]}</div>
                    ) : (
                        <div className="text-gray-800 leading-relaxed text-sm break-words">{edLines(P.lines.slice(b.lines[0] - 1, b.lines[1]), ctx, P.style)}</div>
                    )}
                    {rw === null && (
                        <div className="mt-3 pt-3 border-t border-dashed border-slate-200 flex flex-wrap items-center gap-2" onClick={(e) => e.stopPropagation()}>
                            {(modN > 0 || isOvr) && (
                                <span className="text-xs font-bold text-violet-700">{isOvr ? '✍️ 已整段改寫' : `✏️ 已修改 ${modN} 處`}
                                    <button type="button" onClick={() => onResetBlock(b.id, keys)} className="ml-2 underline decoration-dotted text-slate-500 hover:text-slate-800">↺ 還原這張</button></span>
                            )}
                            <button type="button" onClick={() => setRw(copyText)} className="px-3 py-1 rounded-full border border-slate-200 bg-white text-xs font-bold text-slate-600 hover:bg-slate-50">✍️ 整段改寫</button>
                            {(INSPIRE[b.id] || keys.length > 0) && (
                                <button type="button" onClick={() => onInspire(b.id)} className="ml-auto px-4 py-1.5 rounded-full border-2 border-orange-300 bg-orange-50 hover:bg-orange-100 text-orange-700 text-xs font-extrabold">💡 修改靈感</button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // 右側「修改靈感」抽屜
        const InspireDrawer = ({ P, bid, vals, onApply, onClose }) => {
            const b = P.blocks.find(x => x.id === bid); if (!b) return null;
            const I = INSPIRE[bid] || { ideas: [], tips: [] };
            const keys = P.bk[bid];
            const groups = [...new Set(keys.map(k => metaOf(k).g).filter(Boolean))];
            const links = groups.map(g => ({ g, where: P.blocks.filter(x => P.bk[x.id].some(k => metaOf(k).g === g)).map(x => P.tagOf(x)) })).filter(x => x.where.length > 1);
            const syncs = keys.map(k => ({ k, n: (P.raw.match(new RegExp('\\{\\{' + k + '\\|', 'g')) || []).length })).filter(x => x.n > 1);
            return (
                <div className="fixed inset-0 z-50 flex justify-end" role="dialog" aria-label="修改靈感">
                    <div className="absolute inset-0 bg-slate-900/40 animate-fade-in" onClick={onClose}></div>
                    <div className="relative w-full max-w-md h-full bg-white shadow-2xl overflow-y-auto p-6 space-y-5 animate-fade-in">
                        <div className="flex items-start justify-between gap-3">
                            <div><p className="text-xs font-bold text-orange-600">💡 修改靈感</p><h3 className="text-lg font-extrabold text-slate-800 mt-0.5">{b.tag}</h3></div>
                            <button type="button" onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold" aria-label="關閉">×</button>
                        </div>
                        {I.ideas.length > 0 && I.ideas.map(([t, d, apply], i) => (
                            <div key={i}>
                                <p className="font-extrabold text-indigo-700">靈感 {i + 1}：{t}</p>
                                <div className="mt-2 rounded-lg border-l-4 border-yellow-400 bg-yellow-50 px-4 py-3 text-sm text-slate-800 leading-relaxed">{d}</div>
                                {apply && <button type="button" onClick={() => onApply(apply)} className="mt-2 px-3 py-1 rounded-full bg-violet-500 hover:bg-violet-600 text-white text-xs font-bold">✨ 套用這個靈感</button>}
                            </div>
                        ))}
                        {!I.ideas.length && <p className="text-sm text-slate-600">這一段的<span className="ed-field mx-1">黃色底線</span>文字都可以直接點開修改。</p>}
                        {I.tips.length > 0 && (
                            <ul className="space-y-1.5 text-sm text-slate-700">{I.tips.map((t, i) => <li key={i} className="flex gap-2"><span className="shrink-0">•</span><span>{t}</span></li>)}</ul>
                        )}
                        {(links.length > 0 || syncs.length > 0) && (
                            <div className="rounded-xl bg-amber-50 border border-amber-200 p-4 space-y-2">
                                <p className="font-extrabold text-amber-700">🔗 連動提醒</p>
                                <ul className="space-y-1.5 text-sm text-slate-700">
                                    {syncs.map(s => <li key={s.k} className="flex gap-2"><span className="shrink-0">•</span><span>「{vals[s.k] !== undefined ? vals[s.k] : P.defs[s.k]}」在指令裡出現 {s.n} 次，改一處會全部一起改。</span></li>)}
                                    {links.map(x => <li key={x.g} className="flex gap-2"><span className="shrink-0">•</span><span>「{x.g}」出現在：{x.where.map(w => '【' + w + '】').join('、')}</span></li>)}
                                </ul>
                            </div>
                        )}
                        <p className="text-xs text-slate-400">套用後可以再點黃色底線的文字微調；按卡片下方「↺ 還原這張」可以回到原本的指令。</p>
                    </div>
                </div>
            );
        };

        const FoldBox = ({ id, tone, label, count, folds, setFolds, force, children }) => {
            const open = !!folds[id] || !!force;
            const C = { indigo: ['border-indigo-300', 'bg-indigo-600', 'text-indigo-900', 'bg-indigo-50'], orange: ['border-orange-300', 'bg-orange-500', 'text-orange-900', 'bg-orange-50'], purple: ['border-purple-300', 'bg-purple-600', 'text-purple-900', 'bg-purple-50'], teal: ['border-teal-300', 'bg-teal-600', 'text-teal-900', 'bg-teal-50'], emerald: ['border-emerald-300', 'bg-emerald-600', 'text-emerald-900', 'bg-emerald-50'], rose: ['border-rose-300', 'bg-rose-600', 'text-rose-900', 'bg-rose-50'] }[tone];

                    <section className="animate-fade-in bg-white rounded-2xl shadow-lg border border-slate-200 p-5 md:p-6 space-y-4">
                        <SectionHeader n="✓" tone="purple" first>🔴 部署完成後：試算表的「🤖 AI 批改」選單</SectionHeader>
                        {/* 🤖 AI 批改選單（依實際後台畫面） */}
                        <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-4">
                            <p className="font-bold text-slate-800">何時出現？在哪裡？有什麼功能？</p>
                            <div className="grid grid-cols-1 lg:grid-cols-5 gap-5 items-start">
                                <div className="lg:col-span-2 space-y-2">
                                    <div className="rounded-xl border border-slate-300 shadow-md overflow-hidden bg-white text-sm">
                                        <div className="flex items-center gap-4 px-3 py-2 bg-slate-50 border-b border-slate-200 text-slate-600">
                                            <span>擴充功能</span><span>說明</span>
                                            <span className="px-2 py-0.5 rounded bg-purple-100 text-purple-900 font-bold ring-2 ring-purple-400">🤖 AI 批改</span>
                                        </div>
                                        <div className="ml-6 my-2 mr-3 rounded-lg border border-slate-200 shadow-lg bg-white text-[13px]">
                                            {[['① 開始設定（建立分頁、檢查 ID、寄信授權）', 'a'], ['② 設定 API Key（自動列出可用模型）', 'a'], ['—'], ['③ ✨ AI 產生評量規準（先選題庫的列）', 'b'], ['—'], ['④ ▶️ 開始批改（系統自動判斷要批哪些）', 'c'], ['⑤ 📢 公開成績給學生', 'c'], ['—'], ['🧰 其他工具　▶', 'd']].map(([t, c], i) => t === '—'
                                                ? <div key={i} className="border-t border-slate-200 my-1"></div>
                                                : <div key={i} className={`px-3 py-1.5 ${c === 'a' ? 'bg-purple-50/70' : ''} ${c === 'd' ? 'bg-slate-100 font-bold' : ''}`}>{t}</div>)}
                                        </div>
                                    </div>
                                    <div className="ml-auto w-[78%] rounded-lg border border-slate-300 shadow-lg bg-white text-[13px]">
                                        <p className="px-3 pt-2 pb-1 text-[11px] font-bold text-slate-500">🧰 其他工具 ▶ 的子選單</p>
                                        {['🧪 產生示範作答（不動真實作答）', '📂 打開雲端資料夾', '📧 寄一封測試信給自己', '■ 停止自動接續批改'].map(t => <div key={t} className="px-3 py-1.5 border-t border-slate-100">{t}</div>)}
                                    </div>
                                </div>
                                <div className="lg:col-span-3 space-y-3 text-sm text-slate-700">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        <div className="rounded-lg bg-purple-50 border border-purple-200 p-3"><p className="font-bold text-purple-900">⏰ 何時出現？</p><p className="mt-1">建立副本後，<strong>開啟或重新整理試算表</strong>就會出現；之後每次開啟都會自動出現。</p></div>
                                        <div className="rounded-lg bg-purple-50 border border-purple-200 p-3"><p className="font-bold text-purple-900">📍 在哪裡？</p><p className="mt-1">試算表上方的選單列，「擴充功能、說明」的右邊。第一次點選單時會要求授權。</p></div>
                                    </div>
                                    <p className="font-bold text-slate-800">🧰 第一次：先做 ①、②（淡紫色兩項）</p>
                                    <ol className="space-y-1.5">
                                        <li className="flex gap-2 items-start"><span className="shrink-0 w-5 h-5 mt-0.5 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center">1</span><span><strong>① 開始設定</strong>：建立需要的分頁、檢查 SHEET_ID 與 FOLDER_ID，並完成寄信授權。</span></li>
                                        <li className="flex gap-2 items-start"><span className="shrink-0 w-5 h-5 mt-0.5 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center">2</span><span><strong>② 設定 API Key</strong>：貼上自己的免費 API key，系統會自動列出可用的模型。</span></li>
                                    </ol>
                                    <p className="font-bold text-slate-800">🔁 之後每次出作業：③ → ④ → ⑤</p>
                                    <ol className="space-y-1.5">
                                        {[['3', '在 ⚙️題庫 新增單元，<strong>先點選那一列</strong>，再按「③ ✨ AI 產生評量規準」，AI 依學科本質寫出 0 分／一半／全部三等級規準（可再修改）。'], ['', '學生從前台送出作答，該單元的作答分頁會多一列。'], ['4', '按「④ ▶️ 開始批改」，系統會<strong>自動判斷</strong>哪些作答還沒批改，逐一交給 AI 批改。'], ['5', '看過批改結果後，按「⑤ 📢 公開成績給學生」，學生才能在前台「🔍 查詢成績與詳解」看到。']].map(([n, t], i) => (
                                            <li key={i} className="flex gap-2 items-start"><span className={`shrink-0 min-w-[1.25rem] h-5 px-1 mt-0.5 rounded-full text-xs font-bold flex items-center justify-center ${n ? 'bg-purple-500 text-white' : 'bg-slate-200 text-slate-600'}`}>{n || '…'}</span><span dangerouslySetInnerHTML={{ __html: t }}></span></li>
                                        ))}
                                    </ol>
                                    <p className="font-bold text-slate-800">🧰 其他工具</p>
                                    <ul className="space-y-1">
                                        <li>🧪 <strong>產生示範作答</strong>：還沒有學生作答時，先產生示範資料練習批改流程，不會動到真實作答。</li>
                                        <li>📂 <strong>打開雲端資料夾</strong>：直接開啟 FOLDER_ID 資料夾，查看學生的手寫合成圖。</li>
                                        <li>📧 <strong>寄一封測試信給自己</strong>：確認寄信功能正常。</li>
                                        <li>■ <strong>停止自動接續批改</strong>：全班批改會分段自動接續，想中途停下時按這個。</li>
                                    </ul>
                                </div>
                            </div>
                            <div className="border-t-2 border-dashed border-slate-200 pt-4 space-y-2">
                                <p className="font-bold text-slate-800">📑 試算表底部的工作表分頁</p>
                                <div className="flex flex-wrap items-center gap-1 bg-slate-100 rounded-lg px-3 py-2 text-sm">
                                    {['工作表1', '⚙️學生名單', '⚙️題庫', '⚙️系統設定', '工作坊參與者使用', '一年級 加減法', '高一物理 牛頓運動定律', '…'].map(n => <span key={n} className="px-3 py-1.5 rounded-md bg-white border border-slate-200 text-slate-700">{n}{n !== '…' && ' ▾'}</span>)}
                                </div>
                                <ul className="text-sm text-slate-700 space-y-1">
                                    <li>• <strong>⚙️ 開頭的分頁</strong>（學生名單、題庫、系統設定）：老師設定用，前台的名單、單元與網頁標題都從這裡讀取。</li>
                                    <li>• <strong>其他以單元命名的分頁</strong>（如「一年級 加減法」「高一物理 牛頓運動定律」）：各單元的學生作答與批改結果，分頁名稱就是 ⚙️題庫 的「單元名稱」。</li>
                                    <li>• <strong>工作表1</strong>：試算表原本的預設空白頁，系統不會用到。</li>
                                </ul>
                            </div>
                        </div>
                    </section>
                    <section className="animate-fade-in bg-white rounded-2xl shadow-lg border border-slate-200 p-5 md:p-6 space-y-4">
                        <SectionHeader n="＋" tone="indigo" first>🔴 進階：看懂這套後台程式的提示詞</SectionHeader>
                        <div className="bg-sky-50/60 border border-sky-200 rounded-xl p-4 text-sm text-sky-950">
                            <p className="font-bold text-sky-900">📖 想看懂（或從零生成）這套後台程式？</p>
                            <p className="mt-1">副本裡的程式最初是用下方這份提示詞讓 AI 產生，之後再經過改良：實際的選單已整理成 ①～⑤ 加「其他工具」，和提示詞裡原始的選單規格（⓪～④ 等）略有不同，<strong>操作請以上方說明與你的試算表畫面為準</strong>。點左側段落，右側面板會說明每一條規格的用意；也可以按這個按鈕複製完整提示詞，交給 AI 重新產生 Code.gs 與 Index.html。</p>
                            <div className="mt-3"><CopyBtn id="p2-full" text={edFull('p2')} copied={copiedStates['p2-full']} onCopy={handleCopy} label="一鍵複製完整提示詞" /></div>
                        </div>
                        <div className="flex flex-wrap gap-2 text-xs">
                            {Object.values(P2_CAT).map(c => <span key={c.name} className={`px-3 py-1.5 rounded-full border font-bold ${c.chip}`}>{c.name}｜{c.sub.split('：')[0]}</span>)}
                            <span className="px-3 py-1.5 text-slate-500">提示詞中的編號標註，對應右側解析面板的卡片。</span>
                        </div>
                    </section>
                    <div className="animate-fade-in bg-white flex flex-col rounded-2xl shadow-lg border border-slate-200 overflow-hidden" style={{ height: '800px' }}>
                        <div className="flex flex-col md:flex-row flex-1 overflow-hidden">
                        <div className="w-full md:w-2/3 h-3/5 md:h-full overflow-y-auto p-6 space-y-8 bg-slate-50 no-scrollbar pb-32">
                            {edToolbar('p2')}
                            {[1, 2, 3, 4].map((sec, si) => {
                                const [st, tone] = P2_SECTIONS[sec];
                                const blocks = P2_BLOCKS.filter(x => x.sec === sec);
                                if (edFilter.p2 !== 'all' && !blocks.some(bk => edVisible(EP.p2, bk, edFilter.p2))) return null;
                                return (
                                    <React.Fragment key={sec}>
                                        <SectionHeader n={sec === 1 ? '▶' : String(sec - 1)} tone={tone} first={si === 0}>🔴 {st}</SectionHeader>
                                        <FoldBox id={'p2s' + sec} tone={tone} label={st.split('：')[0]} count={blocks.length} folds={folds} setFolds={setFolds} force={edFilter.p2 !== 'all'}>
                                            {blocks.map(bk => edBlock('p2', bk, 'bg-purple-100 text-purple-800', activeP2, setActiveP2))}
                                        </FoldBox>
                                    </React.Fragment>
                                );
                            })}
                        </div>
                        <AnalysisPanel data={P2_ANALYSIS[activeP2]} Icon={IconLaptop} iconColor="text-purple-400" title="提示詞結構分析面板" />
                        </div>
                    </div>
                    </div>
                    )}
                </main>

                {inspire && <InspireDrawer P={EP[inspire.pid]} bid={inspire.bid} vals={ed.vals} onApply={edApply} onClose={() => setInspire(null)} />}
                {zoomImg && (
                <div className="fixed inset-0 z-50 bg-slate-900/85 flex items-center justify-center p-4 cursor-zoom-out animate-fade-in" onClick={() => setZoomImg(null)} role="dialog" aria-label={zoomImg.alt}>
                    <img src={zoomImg.src} alt={zoomImg.alt} className="max-w-full max-h-full rounded-xl shadow-2xl bg-white" />
                    <button onClick={() => setZoomImg(null)} className="absolute top-4 right-4 bg-white/90 hover:bg-white text-slate-800 font-bold rounded-full w-10 h-10 text-xl" aria-label="關閉">×</button>
                </div>
                )}

                {/* 頁尾 Footer 區塊 */}
                <footer className="bg-slate-900 text-slate-400 py-10 mt-auto border-t border-slate-800">
                    <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between">
                    <div className="flex items-center mb-6 md:mb-0">
                        <UniLogo className="w-16 h-auto mr-4 opacity-80 hover:opacity-100 transition-opacity" />
                        <div>
                        <h3 className="text-xl font-bold text-slate-200 tracking-widest">UNI 優履團隊</h3>
                        <p className="text-sm mt-1">教育新浪潮工作坊</p>
                        </div>
                    </div>
                    <div className="text-center md:text-right text-sm">
                        <p className="mb-2 text-slate-300 font-medium">請尊重智慧財產，使用請引註</p>
                        <p>Prompt 模板來源：優履團隊</p>
                        <p>陳佩英教授計畫團隊與優履團隊研發設計 © 2026</p>
                    </div>
                    </div>
                </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
