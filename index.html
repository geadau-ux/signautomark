        body { background: #f8fafc; color: #1e293b; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* 貓咪動畫 */
        @keyframes catBlink {
            0%, 96%, 98%, 100% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        .cat-eyes {
            animation: catBlink 4s infinite;
        }

        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
        }
        .cat-tail {
            animation: tailWag 3s ease-in-out infinite;
        }

        /* 提示詞區塊樣式 */
        .prompt-block {
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        .prompt-block:hover {
            border-color: #cbd5e1;
            transform: translateX(4px);
        }
        .prompt-block.active {
            border-color: #6366f1;
            background-color: #f8fafc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: translateX(8px);
        }
        .prompt-block::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 0;
            background-color: #6366f1;
            transition: height 0.2s;
            border-radius: 4px;
        }
        .prompt-block.active::before { height: 60%; }

        /* 螢光筆標註樣式 */
        .highlight-base {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            cursor: help;
            border-bottom-width: 2px;
            border-bottom-style: dashed;
            display: inline-block;
            margin: 2px 0;
            transition: background-color 0.2s;
        }
        .hl-yellow { background-color: #fef08a; color: #854d0e; border-bottom-color: #ca8a04; }
        .hl-yellow:hover { background-color: #fde047; }
        .hl-green { background-color: #bbf7d0; color: #166534; border-bottom-color: #16a34a; }
        .hl-green:hover { background-color: #86efac; }
        .hl-blue { background-color: #bfdbfe; color: #1e3a8a; border-bottom-color: #2563eb; }
        .hl-blue:hover { background-color: #93c5fd; }
        .hl-pink { background-color: #fbcfe8; color: #9d174d; border-bottom-color: #db2777; }
        .hl-pink:hover { background-color: #f9a8d4; }
        .hl-purple { background-color: #e9d5ff; color: #581c87; border-bottom-color: #9333ea; }
        .hl-purple:hover { background-color: #d8b4fe; }
        .hl-orange { background-color: #ffedd5; color: #9a3412; border-bottom-color: #ea580c; }
        .hl-orange:hover { background-color: #fed7aa; }
        .hl-teal { background-color: #ccfbf1; color: #0f766e; border-bottom-color: #0d9488; }
        .hl-teal:hover { background-color: #99f6e4; }
        .hl-indigo { background-color: #e0e7ff; color: #3730a3; border-bottom-color: #4f46e5; }
        .hl-indigo:hover { background-color: #c7d2fe; }
        .hl-red { background-color: #fecaca; color: #991b1b; border-bottom-color: #dc2626; }
        .hl-red:hover { background-color: #fca5a5; }

        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 指令修改器 */
        .ed-field { background:#fef9c3; border-bottom:2px dashed #eab308; padding:0 3px; margin:0 1px; border-radius:3px; outline:none; cursor:text; color:#713f12; }
        .ed-field:hover { background:#fef08a; }
        .ed-field:focus { background:#fff; box-shadow:0 0 0 2px #8b5cf6; border-bottom-color:transparent; color:#1e293b; }
        .ed-field.ed-changed { background:#ede9fe; border-bottom-color:#7c3aed; box-shadow: inset 0 0 0 1.5px #a78bfa; color:#4c1d95; }
        .ed-field:empty::before { content:'（空白）'; color:#94a3b8; }
        .ed-pill { display:inline-flex; align-items:center; gap:2px; margin-left:3px; padding:0 6px; border-width:1.5px; border-style:solid; border-radius:9999px; font-size:11px; font-weight:700; line-height:1.6; white-space:nowrap; vertical-align:1px; }
    </style>

<script type="application/json" id="prompt-data">"我想要將這份考卷轉換為 Google 表單（Google Form）並自動連結 Google 試算表，透過 Google Apps Script (GAS) 建立一套三階段工作流：\n- **第一階段（`step1`）**：題目驗算、數學/理化符號轉譯為 Unicode 上下標、國語文直式注音完整轉譯（嚴格保留「聲符＋介音＋韻符＋聲調」不漏字）、列出每題非選題的完整容錯答案清單、建立表單（**選擇題必須透過 `createChoice` 綁定預設標準答案與配分**）與防洩題作答提示。\n- **第二階段（`step2`）**：建立「{{p1sheet|自動批改明細}}」分頁，**每一題皆獨立一欄**，逐題依據「選擇題標準答案（自動相容 `(C)`、`C.` 等各種括號格式）」與「填充題容錯答案清單」進行程式＋公式批改，自動標註 `⚠️第N次提交`（且支援保留已手改的計算題分數），並寫入各題得分、各大題小計公式與全卷總分公式。\n- **第三階段（`step3`）**：在試算表植入「{{p1menu|⚙️ 試卷管理}}」自訂選單（直接調用 `step2()` 完整執行容錯批改與 `⚠️第N次提交` 標記、重新加總），並能寄發含作答對照與詳解的 HTML 成績單。\n【防注意力渙散鐵律】：請嚴格採取「一次只執行一個階段」模式！{{p1stop|現在請只執行【階段一】}}，並在輸出程式碼前先印出該階段的「✅ 自我檢核清單」，結尾主動停下來等我確認後，再進入下一階段（切勿一次輸出所有階段程式碼）。\n【全階段通用的結尾規則】：每個階段輸出的程式碼檔，最後一行都必須是純註解 `// === [檔案結束] ...`（開頭不可有 `}`），嚴禁在函式結束後多寫額外的 `}`；輸出前請自行檢查大括號成對。\n\n---\n\n### 🟦 階段一：題目驗算、非選題容錯答案表、Unicode/注音轉譯與建立表單（`step1`）\n\n#### 🟣 核心功能（要做出什麼）\n- 表單建立與**選擇題預設正解綁定**：開啟 `setIsQuiz(true)`、`setCollectEmail(true)`、`setAllowResponseEdits(false)`、`setAcceptingResponses(true)`、**選擇題強制以 `item.createChoice(選項文字, isCorrect)` 綁定預設標準答案與 `item.setPoints(配分)`**（確保學生一交卷就能在 Google 表單獲得選擇題分數！），並以 `form.setDestination(FormApp.DestinationType.SPREADSHEET, SHEET_ID)` 自動連結試算表；依序建立基本資料必填 {{p1basicn|3}} 題（{{p1basic|班級、座號、姓名}}）➔ 選擇題（含預設正解與配分）➔ 填充題（套用防洩題 `HelpText`）➔ 計算/簡答題；最後於 `Logger.log` 印出 `getEditUrl()` 與 `getPublishedUrl()`。\n- **【非選擇題「每題完整容錯答案清單」與防洩題提示對照表】**：必須針對**每一題填充題/非選題**逐題列出至少 {{p1var|6~10}} 種相容寫法（涵蓋：半形、全形、Unicode 上下標、一般鍵盤打字、國字正負/加減乘除/分之/次方/絕對值、國語文注音含一聲空白與輕聲點位置、全稱與簡稱），方便老師也能直接複製貼回 Google 表單手動設定正解！表格欄位強制固定為：\n  **`｜題號｜標準答案｜可容錯答案完整清單（以頓號分隔）｜預計顯示的 HelpText（嚴禁含答案）｜精簡詳解｜`**。\n- 跨科符號與**國語文注音轉譯鐵律**：\n  1. **數理化 Unicode 轉譯**：Google 表單不支援 LaTeX，建立題目與選項時**嚴禁出現 `$`、`\\times`、`^`、`_` 原始碼**，必須全面轉譯為直觀 Unicode 字元：\n     - 上標（指數/次方/離子價數）：`⁰ ¹ ² ³ ⁴ ⁵ ⁶ ⁷ ⁸ ⁹ ⁺ ⁻ ⁿ`（如 `2⁵`、`10⁻⁷`、`SO₄²⁻`、`Fe³⁺`、`°C`）。\n     - 下標（化學分子式/足碼）：`₀ ₁ ₂ ₃ ₄ ₅ ₆ ₇ ₈ ₉`（如 `H₂O`、`CO₂`、`a₁`）。\n     - 科學、絕對值與化學反應符號：`×`、`÷`、`±`、`|x|`、`≥`、`≤`、`≠`、`≈`、`→`、`⇌`、`↑`、`↓`、`△`。\n  2. **國語文「直式排版」與「注音符號（聲符＋介音＋韻符＋聲調）」完整性鐵律（極重要！）**：\n     - **忽略一般國字旁的輔助旁注音（Ruby Text）**：若考卷為國小直式排版（由右至左、由上至下），一般國字右側附帶的細小輔助注音請直接忽略，只擷取正體國字，避免題幹變成「中ㄓㄨㄥ文ㄨㄣˊ」亂碼！\n     - **題目考點「括號內／框線內的單獨注音」必須 100% 完整保留「聲符＋介音＋韻符＋聲調」**：直式注音是由上往下排列且聲調標在右側，轉為 Google 表單橫式字串時，**絕對不可漏掉最上方的「聲符（ㄅ~ㄙ）」或下方的「韻符（ㄚ~ㄦ）」，且必須依照『聲符 ➔ 介音（ㄧㄨㄩ）➔ 韻符 ➔ 聲調（ˊ ˇ ˋ ˙）』的標準順序緊密排列**！\n     - **根據前後文語意雙重校驗注音**：例如看到「我『ㄉㄨㄛˇ』在門後面（躲）」、「『ㄔㄥˊ』語（成）」、「環保『ㄉㄞˋ』（袋）」、「『ㄕㄚˋ』時間（煞）」、「孤『ㄌㄧㄥˊ ㄌㄧㄥˊ』（零零）」、「閃『ㄕㄨㄛˋ』其詞（爍）」，必須結合詞義確認「聲符＋介音＋韻符＋聲調」四要素完整無缺，**嚴禁因為字體擠壓而吃掉聲符或把聲調打成會消失的特殊組合碼（請固定使用全形標準聲調：`ˊ`、`ˇ`、`ˋ`、`˙`）**！\n- **非選擇題填答說明（`setHelpText`）：涵蓋國語文注音/國字、指數/絕對值/化學方程式範例 ＋ 上層概念防洩題線索**：\n  填充題與計算題必須設定 `setHelpText()`，提供豐富格式範例但**絕對禁止出現該題真實答案**！\n  1. **【國語文注音/改錯字、數值、指數、科學記號、絕對值、比較符號、化學方程式題】——一律在程式碼開頭宣告並引用以下 7 個固定常數（嚴禁自己重造數字或填答案字音）**：\n     - `const HELP_ZHUYIN = '【作答提示】填寫注音請依序輸入「聲符＋介音＋韻符＋聲調」（一聲免空白，輕聲點 ˙ 可打在前面或後面）；填寫國字或改錯字請直接輸入正確國字。範例：ㄓㄨㄥ、ㄔㄥˊ、ㄉㄨㄛˇ、˙ㄉㄜ、朋友';`\n     - `const HELP_NUM = '【作答提示】全半形皆可（免單位）。正負號或分數可複製 + - ± / 或打國字「正、負、分之」。範例：-88.5、負88.5、3/4、4分之3';`\n     - `const HELP_EXP = '【作答提示】指數與次方全半形、複製上標或打國字皆可。範例：2⁵、2^5、2的5次方、(-3)²、(-3)^2';`\n     - `const HELP_SCI = '【作答提示】科學記號全半形、複製上下標或打國字皆可。範例：1.23×10⁻⁴、1.23*10^-4、1.23乘10的負4次方';`\n     - `const HELP_ABS = '【作答提示】絕對值或座標可複製符號 | | ( ) 或打國字。範例：|-9|、｜-9｜、絕對值-9、(-3, 7)';`\n     - `const HELP_CMP = '【作答提示】大小比較可複製符號 > < = ≥ ≤ 或打國字「大於、小於、等於」。範例：X>Y>Z、X大於Y大於Z';`\n     - `const HELP_CHEM = '【作答提示】代號、化學式或化學方程式（大小寫、一般數字或上下標、箭頭 → 或 = 皆可，免空格）。範例：AB、CO₂、CO2、Fe³⁺、Fe3+、2H₂+O₂→2H₂O、2H2+O2=2H2O';`\n     - 只要答案屬於上述類型，程式碼陣列中**只能直接填寫常數變數名稱 `HELP_ZHUYIN`、`HELP_NUM`、`HELP_EXP`、`HELP_SCI`、`HELP_ABS`、`HELP_CMP`、`HELP_CHEM`**，絕對禁止在陣列裡自己手動打字串舉例！\n  2. **【專有名詞、概念或文字簡答題】——強制給「上層概念（Hypernym）＋同類異例」**：\n     - 若標準答案是某個特定名詞，必須指出該答案所屬的**「上層概念」作為答題線索，並舉一個「同屬該上層概念、但絕非本題答案」的例子**！（例如答案是「{{p1hypA|粒線體}}」➔ 寫：`'【作答線索】請填入一種「{{p1hypB|細胞胞器}}」名稱。格式範例：{{p1hypC|葉綠體}}'`）。\n\n#### 🟢 提醒使用者（AI 要對我說、印給我看的）\n- **必印清單（缺一不可）**：輸出程式碼前，先印出：\n  1. **全卷題目驗算與標準答案一覽表**；\n  2. **需手動補上傳圖片清單**；\n  3. 上方的**【非選擇題「每題完整容錯答案清單」與防洩題提示對照表】**。\n- **步驟 0 引導設定 `SHEET_ID`（零硬編碼）**：在提供程式碼前，先用醒目區塊教我從試算表網址取得 `SHEET_ID`（`/d/` 與 `/edit` 之間），並引導至 GAS 左側齒輪「專案設定 > 指令碼屬性」新增屬性 `SHEET_ID`。同時附上執行口訣：**「1. 清空貼上並確認最底部有 `// === [檔案結束]` ➔ 2. 按 Ctrl+S 儲存（橘點消失）➔ 3. 下拉選單選 `step1` ➔ 4. 點擊 ▶ 執行」**。\n- **一次預載全階段權限**：在 `step1` 最底部加上不需呼叫的 `_preloadAllPermissions_()`（內含 `FormApp.getActiveForm(); SpreadsheetApp.getActiveSpreadsheet(); ScriptApp.getProjectTriggers(); MailApp.getRemainingDailyQuota();`），讓我在階段一就能一次核准所有權限。\n\n#### 🟡 防出錯細節（給低階 AI 的護欄）\n- **【強制綁定 Google 表單選擇題預設正解與配分程式碼範本】**：\n  - ❌ **嚴禁**使用 `item.setChoiceValues(...)`，因為那樣不會設定標準答案！\n  - ✅ **強制使用以下迴圈範本為每一題選擇題設定選項、預設標準答案（`true/false`）與配分**：\n    ```javascript\n    // mcqs 格式: [ ['1. 題幹...', ['(A)選項1', '(B)選項2', '(C)選項3', '(D)選項4'], 2, 5] ] // 第3欄 2 代表第3個選項(C)為正解(0-based)，第4欄 5 代表配分\n    mcqs.forEach(function(q) {\n      var item = form.addMultipleChoiceItem().setTitle(q[0]).setRequired(true).setPoints(q[3]);\n      var choices = q[1].map(function(optText, idx) {\n        return item.createChoice(optText, idx === q[2]); // idx === q[2] 自動將正解設為 true！\n      });\n      item.setChoices(choices);\n    });\n    ```\n- **【防填充題舉例洩題鐵律（極重要！）】**：\n  - ❌ **嚴禁將該題真實答案寫進 `setHelpText` 的「範例：...」中！**\n  - ✅ **表格雙欄強制比對**：在輸出 `step1` 程式碼前的對照表中，必須並排印出 **`[標準答案]`** 與 **`[預計顯示的 HelpText 範例詞]`** 兩欄，自我檢查確認：**`[HelpText 範例詞]` 絕對不等於、也不包含 `[標準答案]` 的任何字詞或數字**！\n- **【防注音缺漏聲符自檢（極重要！）】**：\n  - ✅ **直式注音轉橫式自檢**：在驗算表中遇到每一個注音考點，必須強制標註其對應國字（如 `「ㄉㄨㄛˇ」（躲）`、`「ㄕㄚˋ」（煞）`），確認沒有因為直式排版而漏掉開頭的聲符（ㄅ~ㄙ）！\n\n---\n\n### 🟦 階段二：建立「{{p1sheet|自動批改明細}}」分頁與逐題程式＋公式批改（`step2`）\n*(請在階段一完成並經我確認後再輸出；輸出程式碼前請先印出「✅ 階段二自我檢核清單：1.僅單一頂層 step2 函式且結尾無多餘 }、2.選擇題自動剝除 (C) 括號抓字母比對正解、填充題比對容錯清單、3.0筆交卷時於第2列預埋相容括號之批改公式與SUM公式、4.動態表頭抓姓名、標記⚠️第N次提交並保留手改計算題分數」)*\n\n#### 🟣 核心功能（要做出什麼）\n- 建立「`{{p1sheet|自動批改明細}}`」分頁（**嚴禁省略任何一題！每一題都必須有獨立欄位呈現該題得分結果**）：\n  欄位順序強制固定為：`時間戳記`、`電子郵件`、{{p1basic2|班級、座號、姓名}} ➔ **選擇題每一題獨立得分欄**（`選擇1(X分)`、`選擇2(X分)`...）與 `選擇題小計`（`=SUM(...)`）➔ **填充題每一題獨立得分欄**（`填充1(Y分)`、`填充2(Y分)`...）與 `填充題小計`（`=SUM(...)`）➔ **計算題每一題手改得分欄**（`計算1(Z分)`...，若該列已有老師手改的非 0 分數則予以保留，否則預設填 `0`）與 `計算題小計`（`=SUM(...)`）➔ `全卷總分`（動態加總三大題小計公式，如 `=J2+P2+T2`）。\n- 逐題批改邏輯（選擇題相容括號選項 `(C)`/`C.`、填充題比對容錯答案清單）：\n  1. **選擇題逐題防呆批改（相容 `(A)`、`（A）`、`A.`、`[A]` 等所有選項格式）**：因為表單選項常帶有括號（如 `(C)水凍結成冰`），**嚴禁只用 `indexOf('C') === 0` 比對**！必須先用正規表示式剝除開頭的括號與空白，取出第 1 個英文字母代號（`A`~`E`）與標準答案比對，**符合得該題配分，不符或未作答得 `0` 分**！\n  2. **已有學生交卷時（`rows.length > 1`）**：對每一位學生逐題執行選擇題與填充題程式批改，將**每一題的實際得分數字（配分或 `0`）**寫入該題欄位，並在 `選擇題小計`、`填充題小計`、`計算題小計`、`全卷總分` 寫入 `=SUM(...)` 與加總公式！\n- 雙向國字、注音與符號正規化引擎（`normalizeText`）：將「學生作答」與「每一組容錯答案」都經過以下轉換再比對：\n  1. 全形轉半形並移除所有空白、句號與外圍引號「」；\n  2. **國語文注音聲調正規化**：將不同輸入法產生的二聲（`ˊ`/`´`/`́`）、三聲（`ˇ`/`̌`/`∨`）、四聲（`ˋ`/`｀`/`̀`）、輕聲（`˙`/`・`/`·`）統一轉為標準注音聲調符號，並支援輕聲點在字首或字尾（如 `˙ㄉㄜ` 與 `ㄉㄜ˙` 皆相容）；\n  3. 國字性質與運算符號轉標準符號：`正`➔`+`、`負`➔`-`、`絕對值([^|]+)`➔`|$1|`、`大於`➔`>`、`小於`➔`<`、`等於`/`→`/`⇌`➔`=`、`乘以/乘/×/x`➔`*`、`除以/除/÷`➔`/`、`([0-9.]+)分之([0-9.]+)`➔`$2/$1`、`的([+-]?[0-9]+)次方`➔`^$1`；\n  4. Unicode 上下標轉半形：`⁰-⁹⁺⁻`➔`^0-^9+-`、`₀-₉`➔`0-9`，並統一轉英文大寫。\n\n#### 🟢 提醒使用者（AI 要對我說、印給我看的）\n- **重複提交自動標註 `⚠️第N次提交`**：統計每位學生（以相同的**電子郵件**轉小寫去空白為準，若無信箱則以同{{p1basic3|班級＋座號＋姓名}}為準）在整張回應表中的總提交次數（`totalCount`）與當前是第幾次提交（`curAttempt`）；**只要該學生 `totalCount > 1`，就強制在「`{{p1sheet|自動批改明細}}`」分頁的「電子郵件」與「姓名」欄位最前面加上醒目的 `'⚠️第' + curAttempt + '次提交_'` 前綴標記**！\n\n#### 🟡 防出錯細節（給低階 AI 的護欄）\n- **保留手改計算題分數**：若「`{{p1sheet|自動批改明細}}`」原本已經存在且老師已經在計算題欄位填入非 0 的手改分數，重跑 `step2()` 時必須先讀取舊表的計算題分數予以保留，不可全部洗成 0！\n- **尚未有人交卷時（`rows.length <= 1`，0 筆學生資料）**：**絕對禁止報錯中斷！** 必須在「`{{p1sheet|自動批改明細}}`」的**第 2 列（Row 2）預先寫入每一題相容括號的試算表動態批改公式與加總公式**：\n  - 選擇題每題公式（自動相容 `(C)`、`（C）`、`C.`）：`=IF(ISBLANK('回應分頁名'!G2), 0, IF(REGEXMATCH(TRIM('回應分頁名'!G2), \"^[(\\\\[（【\\\\s]*標準答案字母([)\\\\]）】.、\\\\s]|$)\"), 配分, 0))`\n  - 填充題每題容錯批改公式：`=IF(ISBLANK('回應分頁名'!K2), 0, IF(REGEXMATCH(UPPER(TRIM('回應分頁名'!K2)), \"^(容錯答案1|容錯答案2|容錯答案3)$\"), 配分, 0))`\n  - 小計與總分欄公式：寫入 `=SUM(...)` 與三大題相加公式！\n- **【強制逐題迴圈批改（含 `(C)` 括號選項萃取）與 `=SUM` 公式範本（極重要！）】**：\n  - ❌ **絕對禁止**因為選項帶有 `(C)` 或 `（C）` 就比對失敗給 0 分！\n  - ✅ **強制使用以下結構逐題批改「選擇題（自動剝除括號抓出 A~E）」與「填充題（容錯陣列比對）」，並寫入每一題得分與小計/總分公式**：\n    ```javascript\n    // 1. 選擇題逐題批改（mcqAns 為每題正解字母如 ['C','A',...]，mcqPts 為每題配分陣列）\n    for (var m = 0; m < mcqAns.length; m++) {\n      var rawM = String(row[mcqStartCol + m] || '').trim();\n      // 關鍵防呆：剝除開頭的 ( ) （ ） [ ] 與空白，精準抓出第一個英文字母 A~E\n      var mMatch = rawM.replace(/^[(\\[（【\\s]+/, '').match(/^([A-E])/i);\n      var stuLetter = mMatch ? mMatch[1].toUpperCase() : normalizeText(rawM);\n      var keyLetter = String(mcqAns[m]).replace(/[^A-E]/gi, '').toUpperCase() || normalizeText(mcqAns[m]);\n      var scoreM = (rawM !== '' && stuLetter === keyLetter) ? mcqPts[m] : 0;\n      outRow.push(scoreM); // 寫入該題選擇題得分結果（配分或 0）\n    }\n    outRow.push('=SUM(' + colLetter(mcqOutStart) + rNum + ':' + colLetter(mcqOutEnd) + rNum + ')'); // 選擇題小計公式\n\n    // 2. 填充題逐題容錯批改（fillKeys 為每題容錯答案二維陣列，fillPts 為每題配分陣列）\n    for (var f = 0; f < fillKeys.length; f++) {\n      var stuF = normalizeText(row[fillStartCol + f]);\n      var hitF = stuF !== '' && fillKeys[f].some(function(k) { return normalizeText(k) === stuF; });\n      var scoreF = hitF ? fillPts[f] : 0;\n      outRow.push(scoreF); // 寫入該題填充題得分結果（符合容錯得配分，否則 0）\n    }\n    outRow.push('=SUM(' + colLetter(fillOutStart) + rNum + ':' + colLetter(fillOutEnd) + rNum + ')'); // 填充題小計公式\n    ```\n- **單一頂層函式封裝（徹底防止選錯下拉選單）**：**整個 `step2` 檔案頂層絕對只能有唯一一個 `function step2()`！** 所有的輔助函式（如 `normalizeText`、欄位轉英文 `colLetter`）與答案配分陣列**必須 100% 包在 `function step2()` 的大括號內部**，讓 GAS 上方執行下拉選單只有 `step2` 唯一一個選項！\n- **全語系表單回應偵測 ＋ 表頭動態定位（解決姓名等基本資料不齊或題目欄錯位問題）**：\n  - 使用正規表示式尋找回應分頁：`const formSheet = ss.getSheets().find(function(s) { return /表單回[應覆]|Form Responses/i.test(s.getName()); });`。\n  - 讀取原始回應第 1 列表頭（`headers`），**動態搜尋表頭文字包含 `'郵件'|'Email'`、{{p1basic4|'班級'、'座號'、'姓名'}} 的真實欄位索引，並定位第 1 題選擇題的起始欄位 `mcqStartCol`（切勿把 C 欄「分數/Score」當成題目或班級！）**，將讀出的班級、座號、姓名強制轉字串 `String(val || '').trim()`！\n\n---\n\n### 🟦 階段三：植入「{{p1menu|⚙️ 試卷管理}}」四合一選單與寄送成績單（`step3`）\n*(請在階段二完成並經我確認後再輸出；輸出程式碼前請先印出「✅ 階段三自我檢核清單：1.gradeSelectedOrNewRows 直接呼叫 step2() 確保⚠️標記與容錯批改完整執行、2.第一行直接用 SpreadsheetApp.getActiveRangeList() 抓選取列、3.剝除⚠️前綴寄信且結尾無多餘 }」)*\n\n#### 🟣 核心功能（要做出什麼）\n- 遠端安裝開啟觸發器：`step3()` 讀取 `SHEET_ID` 並建立觸發器 `ScriptApp.newTrigger('createQuizMenu').forSpreadsheet(SHEET_ID).onOpen().create();`（因為是透過 `SHEET_ID` 遠端連線的獨立腳本，必須安裝 `.onOpen()` 觸發器並指向 `createQuizMenu` 才會生效）。\n- `createQuizMenu(e)` 使用 `ss.addMenu('{{p1menu|⚙️ 試卷管理}}', [...])` 建立選單（**免用 `getUi()`，且嚴禁將函式直接命名為 `onOpen` 以免老師在後台誤按崩潰**），包含 **4 個控制按鈕**：\n  1. `{{p1m1|📝 自動批改選取列（或新交卷）}}` (`gradeSelectedOrNewRows`)：**直接呼叫同專案的 `step2()` 執行完整重批改！**（詳見下方「直接呼叫 `step2()`」鐵律）\n  2. `{{p1m2|🔄 重新加總選取列成績}}` (`recalculateSelectedRows`)：老師填完計算題手改分數後，重新寫入選取列的小計與總分公式。\n  3. `{{p1m3|📧 寄送成績單（僅限選取列）}}` (`sendSelectedEmails`)：僅針對反白選取的學生列寄信（寄信時自動以 `.replace(/^⚠️第\\d+次提交_/, '')` 還原真實 Email）。\n  4. `{{p1m4|📢 寄送成績單（全班寄發）}}` (`sendAllEmails`)：全班批次寄出含「各大題小計、總分」與「{{p1rep|每題作答、標準答案、得分、詳解}}」的 HTML 表格成績單。\n\n#### 🟢 提醒使用者（AI 要對我說、印給我看的）\n- **F5 重整提示與右下角 `ss.toast()` 即時進度通知**：`step3` 執行後在 `Logger.log` 提示老師「請回到 Google 試算表按 F5 重新整理，上方即會出現 {{p1menu|⚙️ 試卷管理}}選單」；當老師在試算表點擊批改、加總或寄信時，皆透過 `ss.toast()` 在試算表右下角跳出完成提示。\n\n#### 🟡 防出錯細節（給低階 AI 的護欄）\n- **【根治 `step3` 選單批改偷懶漏寫 `⚠️第N次提交` 標記鐵律：直接呼叫 `step2()`！】**：\n  - ❌ **為什麼之前在試算表點「📝 自動批改」會沒有 `⚠️第N次提交` 標記？** 因為 AI 在 `step3` 為了省行數，在 `gradeSelectedOrNewRows()` 裡偷懶只重寫了 `=SUM()` 公式，沒有執行 `step2()` 的重複提交統計與容錯批改！\n  - ✅ **強制規定**：由於 GAS 同一個專案下的所有檔案共享全域函式，`step3` 中的 `gradeSelectedOrNewRows()` **必須直接呼叫 `step2();`**，寫法固定如下：\n    ```javascript\n    function gradeSelectedOrNewRows() {\n      const ss = SpreadsheetApp.getActiveSpreadsheet() || SpreadsheetApp.openById(PropertiesService.getScriptProperties().getProperty('SHEET_ID'));\n      step2(); // 直接呼叫 step2.gs 的完整批改、⚠️第N次提交標記與手改分數保留邏輯，絕不偷懶！\n      ss.toast('✅ 已完成最新交卷批改、⚠️重複提交標記更新與總分重算！', '試卷管理', 5);\n    }\n    ```\n- **【根治「反白選取列偵測不到」的致命錯誤（極重要！）】**：\n  - ❌ **為什麼會偵測不到選取列？** 因為若在選單函式開頭先執行 `const ss = SpreadsheetApp.openById(SHEET_ID);`，再呼叫 `ss.getSelection()`，GAS 會開出一個全新的背景實例，導致使用者在畫面上的反白選取範圍完全遺失（永遠只抓到第 1 列或 null）！\n  - ✅ **強制鎖死選取列抓取寫法（必須在呼叫 `openById` 之前先從全域 `SpreadsheetApp` 抓取！）**：\n    在 `recalculateSelectedRows()`、`sendSelectedEmails()` 的**第一行**，必須強制呼叫以下輔助函式取得反白列號陣列 `selectedRows`：\n    ```javascript\n    function getSelectedRowNumbers_() {\n      const rangeList = SpreadsheetApp.getActiveRangeList();\n      if (!rangeList) return [];\n      const rows = [];\n      rangeList.getRanges().forEach(function(r) {\n        for (var i = r.getRow(); i <= r.getLastRow(); i++) {\n          if (i >= 2 && rows.indexOf(i) === -1) rows.push(i);\n        }\n      });\n      return rows;\n    }\n    ```\n    接著才用 `const ss = SpreadsheetApp.getActiveSpreadsheet() || SpreadsheetApp.openById(SHEET_ID);` 進行讀寫！這樣無論老師在「表單回覆」或「自動批改明細」分頁反白單列、多列或按 Ctrl 跳選，都能 **100% 精準抓到反白列號**！"</script>
<script type="application/json" id="p2-prompt-data">"#開場｜角色設定\n你是一位頂尖的 Google Apps Script (GAS) 全端教育科技工程師。\n請幫我開發一套完整的[[1|「{{p2name|數位手寫與文字探索畫布 3.5}}」系統。請分開提供 `Code.gs`（後端）與 `Index.html`（前端）兩個檔案的完整程式碼]]，[[2|不省略任何邏輯，確保能一鍵複製並直接執行。]]\n#模組一｜後端 Code.gs 與 Google Sheets 資料庫結構\n##1. 基礎設定與選單（嚴格綁定函式名稱）\n- 從「指令碼屬性」讀取 `SHEET_ID` 與 `FOLDER_ID`。\n- [[3|`onOpen()` 建立試算表選單「{{p2menu|🤖 AI 批改}}」]]，[[4|必須【嚴格綁定以下指定的函式名稱】，不可自行發明：]]\n  - [[5|\"⓪ 檢查試算表與資料夾 ID\" -> 綁定 `menuCheckIds`]]\n  - [[5|\"① 設定 Gemini API Key\" -> 綁定 `menuSetApiKey`]]\n  - [[5|\"② 建立／檢查設定分頁與同步題庫分頁\" -> 綁定 `setupConfigSheets`]]\n  - [[5|\"③ 測試連線並列出可用模型\" -> 綁定 `menuListModels`]]\n  - [[5|\"④ 檢查題庫與同步建立各單元作答分頁\" -> 綁定 `menuCheckBank`]]\n  - (分隔線)\n  - [[4|\"✨ AI 依學科本質生成評量規準 (0分/一半/全部等級)\" -> 綁定 `menuGenerateRubric`]]\n  - (分隔線)\n  - [[4|\"🎬 示範用：立刻批改最新一份作答\" -> 綁定 `menuGradeLatest`]]\n  - [[4|\"▶️ 批改目前分頁的「待批改」作答\" -> 綁定 `menuGradePending`]]\n  - [[4|\"🔁 重新批改我選取的列\" -> 綁定 `menuRegradeSelected`]]\n  - [[4|\"📢 公開「待老師確認」的批改結果\" -> 綁定 `menuPublishReviewed`]]\n  - (分隔線)\n  - [[4|\"⏹ 停止自動接續批改\" -> 綁定 `menuStopAutoContinue`]]\n##2. 試算表分頁與欄位規格（極重要）\n系統需自動建立或檢查以下分頁，若無則建立並填入預設值：\n- [[6|**`⚙️系統設定`**：欄位[設定項目, 設定值, 說明]。]]包含：模型名稱(預設 [[7|{{p2model|gemini-3.5-flash-lite}}]])、每次批改間隔({{p2gap|13}})、批改完自動公開給學生({{p2pub|是}})、網頁大標題({{p2title|數位手寫與文字探索畫布}})。\n- [[6|**`⚙️批改規準`**：(舊版相容用，可留空)。]]\n- [[6|**`⚙️題庫`**：]][[8|欄位必須完全吻合：[單元名稱（作答分頁會用這個名字）, 開放給學生（是／否）, 年級與學科（AI 會依此學科本質出規準與批改）, 第一題標題, 第一題題目（可用 \\( \\) 寫數學式，**粗體**）, 第一題圖片（雲端連結或圖片網址，可留空）, 第二題標題, 第二題題目, 第二題圖片（雲端連結或圖片網址，可留空）, 給學生看的標準詳解（批改公開後才看得到）, 標準解答＋評量規準（給 AI 批改用，學生看不到）]。]]\n- [[6|**學生作答分頁**：依單元名稱動態建立。]][[8|欄位順序必須嚴格固定為第1~8欄：[時間戳記, 座號, 姓名, 學生作答圖片連結, 老師的鼓勵話語, 得分, 批改狀態, 批改紀錄（僅老師可見）]。]]\n##3. 後端 AI 邏輯與 API 串接\n- [[9|**✨ 生成規準**：呼叫 Gemini，依「年級與學科」的學科本質（如理科重邏輯推演與變因控制、文科重文本脈絡與論述、社會重史地因果）分析題目與詳解，產出 {{p2dim|2~3}} 個「評量面向」，各面向必須列出「０分等級、一半題分等級、全部題分等級」對應條件，]]滿分{{p2full|10}}分，寫入規準欄位。\n- [[10|**▶️ 自動批改**：讀取作答 Base64 圖，呼叫 Gemini Vision，系統提示須要求 AI 依據 0/一半/全部 規準給分。]][[11|強制回傳 JSON (含 is_blank, q1_score, q1_feedback, q2_score, q2_feedback, encouragement, confidence, teacher_note)。]][[12|批改完成後將回饋與鼓勵寫入第5欄「老師的鼓勵話語」、將「q1+q2」寫入第6欄「得分」、狀態寫入第7欄「批改狀態」（若自動公開設為是，狀態設為 `✅已公開`）。]]\n- [[13|具備 3.5 分鐘超時中斷與 Time-driven trigger (`continueGradingJob`) 接續批改。]]\n#模組二｜前端 Index.html 與模擬題庫\n##1. 錯誤處理與 GAS 連線封裝（非常重要）\n- [[14|前端必須實作 `callBackend(methodName, args, onSuccess, onFailure)` 函式。]]\n- [[14|當處於 GAS 環境時，必須使用 `google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure)[methodName](...args)` 來呼叫後端。]]\n- [[14|嚴禁讓前端盲目等待！若 `onFailure` 被觸發（例如授權遭拒或伺服器錯誤），必須]][[15|透過 UI 上的狀態橫幅（Banner）清楚顯示錯誤訊息，並解開按鈕的鎖定狀態。]]\n##2. UI/UX 視覺設計與防護機制\n- 使用 Tailwind CSS (CDN), 導入字體 `Noto Sans TC`，全頁字距 `0.035em`、行距 `1.75`。\n- 配色採高雅溫潤「{{p2style|學院石板灰與米白紙感}}」：背景 `#f6f5f2`，主色調 `#243b53`(石板藍)、`#2d6a4f`(深綠)。畫布背景需有淺色點陣網格 (`#f1f0ec` 28px)。\n- [[16|**圖片防護機制**：前端所有讀取題庫的 `<img>` 標籤，必須加入 `onerror=\"this.parentElement.classList.add('hidden')\"`，確保網址失效或無權限時自動隱藏，避免出現醜陋的破圖圖示。]]\n##3. 模擬環境 (Mock Mode) 與內建題庫\n[[17|若 `google.script.run` 不存在，須啟動預覽模擬版，並將以下三題精確寫入 `MOCK_UNITS` 陣列]]（此三題也需寫入後端 `⚙️題庫` 的 `DEFAULT_UNITS` 供初始建立使用）：\n  - **題庫 1 (數學)**：「{{p2u1|第二課 因數與倍數}}」({{p2u1g|五年級}})。Q1:{{p2u1q1|善化農會水果盒}}(q1img: \"https://i.meee.com.tw/CWKnD5i.png\")。Q2:{{p2u1q2|公車相遇時刻}}(q2img: \"https://i.meee.com.tw/u10pZY8.png\")。\n  - **題庫 2 (自然)**：「{{p2u2|五下自然 水溶液的酸鹼與導電性}}」。Q1:{{p2u2q1|未知水溶液酸鹼檢驗}}(q1img: \"https://i.meee.com.tw/AvAPlav.png\")。Q2:{{p2u2q2|LED導電實驗設計}}。\n  - **題庫 3 (社會)**：「{{p2u3|八上社會 台灣地形與氣候關係}}」。Q1:{{p2u3q1|東北季風與迎風面降水原因}}。Q2:{{p2u3q2|河川坡度陡對水資源保存困難與因應}}。\n##4. Canvas 畫布終極功能 (每題各一塊，預設高度 {{p2h|400px}})\n- [[18|**✏️ 手寫畫筆**]]：4色 (松煙墨黑 `#262626`、普魯士藍 `#2b4c7e`、胭脂紅 `#9e2a2b`、深綠 `#2d6a4f`)，粗細可調。\n- [[18|**🔤 插入文字**]]：點擊畫布彈出 `absolute` 的 `textarea`，確認後用 `fillText` 印死在畫布上（[[19|必須寫出根據畫布寬度的自動折行算法邏輯]]）。\n- [[18|**🖼️ 上傳圖片註記**]]：選擇圖片後產生「可拖曳(Pointer Events)、可縮放(Slider)」的浮動 DOM 預覽框，點擊確認後用 `drawImage` 印在畫布上，若圖片超出高度需自動觸發畫布擴充。\n- [[18|**➕ 增加畫布空間**]]：點擊按鈕將 Canvas 高度增加 {{p2add|280px}}。[[20|**【核心技術】：必須先創建 tempCanvas 備份現有像素，修改高度後，填白底再將 tempCanvas 貼回，絕不能清空原筆跡。**]]\n- [[18|**↩️ 復原上一步**]]：用 `history` 陣列存 Base64 實作。\n- [[18|**送出合成**]]：將兩塊 Canvas 加上標題列與學生姓名，於背景繪製成一張超長 Canvas 垂直拼接圖，轉 Base64 傳給後端存入雲端硬碟。\n##5. 學生端「🔍 觀看教師回饋與分數」雙向連動（極重要，不可遺漏）\n- [[21|**前端頂部雙模式切換按鈕**：導覽列右上角必須同時提供「📝 開始作答」與「🔍 查詢成績與詳解（觀看教師回饋與分數）」兩個切換按鈕。]]切換到查詢模式時，主按鈕文字改為「查詢成績」，並隱藏畫布、顯示成績查詢結果卡片。\n- [[21|**後端 `queryStudent(unitName, seatNo, studentName)` 連動規格**]]：\n  1. [[22|後端必須去對應「單元名稱」的分頁，由下往上搜尋符合「座號（去掉前導0比對）」與「姓名」的所有作答列。]]\n  2. [[22|優先挑選第 7 欄「批改狀態」以 `✅` 開頭（或舊資料有分數）的最新一筆已公開批改列；若尚未批改，則回傳最新送出的一筆。]]\n  3. [[22|必須精準讀取該列的：**第 5 欄「老師的鼓勵話語 (`FEEDBACK`)」**、**第 6 欄「得分 (`SCORE`，如 `10+8` 並自動加總總分 `18`)」**、**第 1 欄「時間戳記」**、**第 4 欄「學生作答圖片連結」**（由後端用 `DriveApp.getFileById` 轉成 Base64 DataURL 回傳，讓圖片不必公開分享也能給學生看），並在已批改公開時一併回傳題庫第 10 欄的「給學生看的標準詳解 (`SOL`)」。]]\n- [[21|**前端查詢結果呈現**]]：清楚顯示批改狀態徽章（`✅ 老師已批改並公開` 或 `⏳ 等待老師批改中`）、總分與各題配分、🤖 AI 與老師的診斷回饋與鼓勵話語框、📖 標準詳解框（支援 MathJax 渲染），以及學生原本的手寫合成圖片。\n#模組三｜防呆機制（務必遵守）\n[[23|JavaScript 程式碼中，凡是正則表達式（Regex）若需要比對反引號，【必須使用 `\\x60` 替代】，例如 `replace(/^\\x60\\x60\\x60(json)?/i, \"\")`。嚴禁在程式碼中直接寫出連三個反引號，否則會破壞 Markdown 區塊導致語法中斷錯誤。]]\n"</script>
<script type="application/json" id="wu-prompt-data">"#開場｜角色設定\n你是一位頂尖的 Google Apps Script (GAS) 全端教育科技工程師。\n請幫我開發{{wuctx|工作坊開場}}用的[[1|「{{wutitle|午後暖身・畫押牆}}」：{{wuwho|師長}}用手機畫押，約 5 秒後出現在大螢幕，親身體驗「前台 → 試算表 → 大螢幕」的即時連動]]。[[2|請分開提供 `Code.gs`（後端）、`Board.html`（手寫板）、`Wall.html`（大螢幕）三個檔案的完整程式碼，不省略任何邏輯，確保能一鍵複製並直接執行。]]\n#模組一｜後端 Code.gs 與試算表後台\n##1. ID 與選單\n- [[3|從「指令碼屬性」讀取 `SHEET_ID` 與 `FOLDER_ID`，不可寫死在程式碼裡；使用者貼整串網址也要能用正規表示式抽出 ID，沒設定時顯示清楚的中文錯誤訊息。]]\n- [[4|`onOpen()` 建立「{{wumenu|🎨 畫押牆}}」選單：「① 開始設定（建立分頁、檢查 ID）」綁定 `menuSetup`、「② 📺 取得大螢幕與手寫板網址」綁定 `menuUrls`、「📂 打開畫押圖片資料夾」綁定 `menuOpenFolder`。]]\n##2. 三個分頁（欄位一字不差）\n- [[5|**`⚙️場次`**：[目前場次（只勾一個）, 場次名稱, 日期, Classroom 課程代碼, 備註]。第一欄是核取方塊，第一次建立時放一列範例。]]\n- [[6|用 `onEdit` 做「單選」：勾新的一列，其他列自動取消，並在右下角跳出「大螢幕約 5 秒後切換」的提示。]]\n- [[5|**`📝畫押紀錄`**：[時間戳記, 場次, 姓名／暱稱, 今天的心情, 畫押圖片, 投影（取消勾選＝下架）, 載具]。]][[7|取消勾選「投影」＝作品立刻從大螢幕下架，資料與圖片都還在，重新勾選就恢復。]]\n- [[5|**`⚙️系統設定`**：[設定項目, 設定值, 說明]，]]包含網頁大標題、手寫板題目、作品每張停留秒數（{{wucard|7}}）、邀請頁停留秒數（{{wuinv|12}}）、每播幾張作品插一次邀請頁（{{wuevery|2}}）、大螢幕刷新間隔（{{wupoll|5}}）、手寫板網址、GAS 部署網址（結尾 /exec）。[[8|秒數最少 3 秒，不合法的值一律改用預設值。]]\n##3. 讀寫與安全\n- [[9|圖片存到雲端資料夾，每一場自動建立「🖼️ 場次名稱」子資料夾。]]\n- [[10|`getWallData` 只回傳文字與圖片 ID，並用 CacheService 快取 3 秒；圖片另用 `getCardImages` 抓 Base64。]]\n- [[11|`getCardImages` 只能回傳「目前場次、正在投影」的作品，一次最多 20 張，不能被拿來讀雲端硬碟裡的其他檔案。]]\n- [[12|`saveDoodle` 只收 png／jpeg、上限 2MB；用 LockService 防止同時寫入；同一個載具 {{wucd|8}} 秒內不能重複送出；開頭是 = + - @ 的文字前面加 '，避免公式注入。]]\n- [[13|`ScriptApp.getService().getUrl()` 在新增部署後常回傳已失效的網址：大螢幕網址一律以老師貼在 ⚙️系統設定 的 /exec 網址為準，沒貼就在「② 取得網址」顯示紅色警告。]]\n#模組二｜前端 Board.html 與 Wall.html\n##1. 共通規格\n- [[14|兩個網頁都要有「預覽模擬模式」：偵測不到 `google.script.run` 時改用假資料，可以試畫、試送出、看輪播；後端呼叫統一用 `call(method, args, ok, fail)` 包裝。]]\n- 字體 Noto Sans TC，心情與簽名用霞鶩文楷 LXGW WenKai TC；配色為藏青漸層頁首、米白紙底 `#f6f5f2`、松柏綠按鈕、黃色 `#fdeb4a` 重點色。\n##2. ✍️ 手寫板 Board.html（手機優先）\n- [[15|畫布內部 720×540（4:3），用 pointer 事件與 `setPointerCapture`；工具：✏️ 畫筆（5 色、粗細滑桿）、😊 蓋章（10 個表情章，點一下就蓋上去）、🧽 橡皮擦、↩️ 復原（最多 15 步）、🗑️ 清空。]]\n- 文字欄：今天的心情（最多 {{wumood|60}} 字）、姓名或暱稱（最多 {{wuname|12}} 字），並附「送出即同意投影」聲明。\n- [[16|送出時把畫布縮成 640×480 的 JPEG（品質 0.82），大螢幕才載入得快；送出中按鈕要鎖住。]]\n- [[17|載具識別：在 localStorage 存一個 DEV-XXXXXX 的 ID，並從瀏覽器資訊判斷 iPad／iPhone／Android／Chromebook／Mac／Windows，一起送給後端。]]\n- [[18|成功畫面：🎉「已送上大螢幕！」，加一句「剛剛這一下：您的手機 → Google 試算表 → 大螢幕」，以及「✏️ 再畫一張」按鈕。]]\n##3. 📺 大螢幕 Wall.html（網址加 ?view=wall）\n- [[19|舞台固定 1920×1080，依視窗大小等比縮放，任何投影機都不跑版。]]\n- [[20|右上角固定 QR Code（掃了開手寫板），右側「🖼️ 大家的畫押」縮圖牆，正在播的那張亮黃框；底部顯示「已有 N 位{{wuwho2|師長}}畫押」。]]\n- [[21|輪播四種頁面：{{wuinvite|加入 Classroom}} 邀請頁（代碼疊在截圖原位、字級自動縮放）、作品頁、空白頁、準備中；每播 N 張作品插一次邀請頁。]]\n- [[22|新作品送達要插隊播出，加上「🆕 剛剛送達」；主持人取消勾選「投影」時，正在播的那張立刻跳走；換場次就整個重來。]]\n- [[23|鍵盤：F 切換全螢幕（瀏覽器擋下時提示按 F11）、→ 或空白鍵跳下一張。]]\n#模組三｜1.1 版：手寫板搬到 Netlify\n- [[24|有些師長手機登入的是學校帳號，學校封鎖 GAS 網頁，掃 QR 打不開。請把手寫板改成可以放在 Netlify 的 `index.html`。]]\n- [[25|`doGet` 加上 `?api=info`，回傳 JSON（標題、題目、目前場次）；新增 `doPost`，body 是 JSON 文字 `{ action: \"save\", payload: {...} }`，呼叫 `saveDoodle` 後回傳 JSON。]]\n- [[26|⚙️系統設定 的「手寫板網址」貼了 Netlify 網址，大螢幕 QR Code 就改用它；「② 取得網址」要分開列出大螢幕、手寫板，以及要貼進 Netlify `API_URL` 的 GAS 部署網址。]]"</script>
<script type="application/json" id="wu-code-data">{"gs": "/**\n * 午後暖身・畫押牆 1.1 —— 後端（Google Apps Script）\n * 1.1：手寫板可放在 Netlify（外部網站），透過 doGet(?api=info)／doPost 讀寫試算表。\n *      師長手機不論登入什麼 Google 帳號（含封鎖 GAS 的學校帳號），掃 QR 都能直接畫押。\n * ----------------------------------------------------------------------------\n * 用途：工作坊下午場（GAS 部署）的開場暖身，讓師長親身體驗「前台 → 試算表 → 大螢幕」的即時連動。\n *\n *   📺 大螢幕（網址後面加 ?view=wall）：16:9 輪播「加入 Classroom 邀請頁」與師長們的畫押作品，\n *        右上角固定 QR Code，右側即時顯示所有人的縮圖。\n *   ✍️ 手寫板（部署網址本身）：手機或筆電都能用——手指畫笑臉、蓋表情章、打字寫心情、簽名，\n *        送出後約 5 秒出現在大螢幕。\n *   🗂️ 試算表後台：\n *        「⚙️場次」　　預先填好每一場的 Classroom 代碼，勾選「目前場次」就切換（一次只能勾一個）。\n *        「📝畫押紀錄」取消勾選「投影」＝立刻從大螢幕下架。\n *        「⚙️系統設定」輪播秒數、邀請頁頻率、手寫板題目、網頁標題。\n *\n * 手寫畫布沿用「數位手寫板 4.2 團隊版」的筆跡做法，簡化成單一畫布＋表情章。\n * 臺師大優履 UNI 團隊\n */\n\n// ====== 基本設定 ======\n// 🔒 請到左側「⚙️ 專案設定」→「指令碼屬性」新增：\n//    SHEET_ID   ＝ 試算表網址 /d/ 和 /edit 中間那一串\n//    FOLDER_ID  ＝ 雲端資料夾網址 /folders/ 後面那一串（師長的畫押圖片存這裡）\nconst PROP_SHEET_ID = \"SHEET_ID\";\nconst PROP_FOLDER_ID = \"FOLDER_ID\";\n\nconst SHEET_SETTINGS = \"⚙️系統設定\";\nconst SHEET_SESSIONS = \"⚙️場次\";\nconst SHEET_LOG = \"📝畫押紀錄\";\n\nconst SESSION_HEADERS = [\"目前場次（只勾一個）\", \"場次名稱\", \"日期\", \"Classroom 課程代碼\", \"備註\"];\nconst LOG_HEADERS = [\"時間戳記\", \"場次\", \"姓名／暱稱\", \"今天的心情\", \"畫押圖片\", \"投影（取消勾選＝下架）\", \"載具\"];\nconst L = { TIME: 1, SESSION: 2, NAME: 3, MOOD: 4, IMG: 5, SHOW: 6, DEV: 7 };\n\nconst DEFAULTS = {\n  title: \"午後暖身・畫押牆\",\n  prompt: \"請用手指頭畫個笑臉、或打字寫下此刻的心情，再加上您的隨便簽名 ✍️\",\n  cardSec: 7,\n  inviteSec: 12,\n  every: 2,\n  pollSec: 5,\n  boardUrl: \"\",\n  execUrl: \"\"\n};\n\nconst SETTING_ROWS = [\n  [\"網頁大標題\", DEFAULTS.title, \"手寫板與大螢幕最上方的標題。\"],\n  [\"手寫板上的題目\", DEFAULTS.prompt, \"師長打開手寫板時看到的邀請語，可以隨場次改寫。\"],\n  [\"作品每張停留（秒）\", DEFAULTS.cardSec, \"大螢幕上每一張師長作品停留的秒數（最少 3 秒）。\"],\n  [\"邀請頁停留（秒）\", DEFAULTS.inviteSec, \"「加入 Classroom」邀請頁每次停留的秒數（最少 3 秒）。\"],\n  [\"每播幾張作品插一次邀請頁\", DEFAULTS.every, \"數字越小，邀請頁出現越頻繁。開場前 10 分鐘建議 1～2，大家都加入後可改成 4。\"],\n  [\"大螢幕刷新間隔（秒）\", DEFAULTS.pollSec, \"大螢幕多久向試算表抓一次新作品。15 人以內設 4～5 秒很穩。\"],\n  [\"手寫板網址（QR Code 用，可留空）\", \"\", \"1.1 版請貼 Netlify 手寫板網址（例如 https://xxx.netlify.app）：大螢幕 QR Code 與 Classroom 公告都用它，師長手機登入什麼帳號都能開。空白＝使用 GAS 內建手寫板。\"],\n  [\"GAS 部署網址（結尾 /exec）\", \"\", \"請貼「部署 → 管理部署作業」裡的網頁應用程式網址。大螢幕網址以它為準（自動抓的網址有時會失效）。\"]\n];\n\nconst WALL_CACHE_KEY = \"WALL_SNAPSHOT_V1\";\nconst SUBMIT_COOLDOWN_SEC = 8;\n\n\n// =====================================================================\n//  〇、從「指令碼屬性」讀取 ID（團隊慣例：ID 不寫死在程式碼裡）\n// =====================================================================\n\nfunction readIdProp_(key) {\n  const raw = String(PropertiesService.getScriptProperties().getProperty(key) || \"\").trim();\n  if (!raw) throw new Error(`系統尚未設定完成：請在「⚙️ 專案設定 → 指令碼屬性」新增「${key}」。`);\n  const m = raw.match(/[-\\w]{25,}/);\n  return m ? m[0] : raw;\n}\n\nlet ss_cache_ = null;\nfunction ss_() {\n  if (!ss_cache_) ss_cache_ = SpreadsheetApp.openById(readIdProp_(PROP_SHEET_ID));\n  return ss_cache_;\n}\n\nfunction folder_() {\n  return DriveApp.getFolderById(readIdProp_(PROP_FOLDER_ID));\n}\n\n// 每一場一個資料夾：🖼️ 場次名稱\nfunction sessionFolder_(sessionName) {\n  const root = folder_();\n  const name = \"🖼️ \" + String(sessionName || \"未命名場次\").replace(/[\\\\/:*?\"<>|]/g, \" \").slice(0, 60);\n  const it = root.getFoldersByName(name);\n  return it.hasNext() ? it.next() : root.createFolder(name);\n}\n\n\n// =====================================================================\n//  一、讀取設定與目前場次\n// =====================================================================\n\nfunction getSettings_() {\n  const s = Object.assign({}, DEFAULTS);\n  const sh = ss_().getSheetByName(SHEET_SETTINGS);\n  if (!sh || sh.getLastRow() < 2) return s;\n  sh.getRange(1, 1, sh.getLastRow(), 2).getValues().forEach(r => {\n    const k = String(r[0]).trim();\n    const v = String(r[1] === null || r[1] === undefined ? \"\" : r[1]).trim();\n    const n = Number(v);\n    if (k === \"網頁大標題\" && v) s.title = v;\n    else if (k === \"手寫板上的題目\" && v) s.prompt = v;\n    else if (k.indexOf(\"作品每張停留\") === 0 && n >= 3) s.cardSec = n;\n    else if (k.indexOf(\"邀請頁停留\") === 0 && n >= 3) s.inviteSec = n;\n    else if (k.indexOf(\"每播幾張作品\") === 0 && n >= 1) s.every = Math.round(n);\n    else if (k.indexOf(\"大螢幕刷新間隔\") === 0 && n >= 2) s.pollSec = n;\n    else if (k.indexOf(\"手寫板網址\") === 0 && /^https?:\\/\\//i.test(v)) s.boardUrl = v;\n    else if (k.indexOf(\"GAS 部署網址\") === 0 && /^https:\\/\\/script\\.google\\.com\\/.*\\/exec/i.test(v)) s.execUrl = v.split(\"?\")[0];\n  });\n  return s;\n}\n\nfunction fmtDate_(d) {\n  return d instanceof Date ? Utilities.formatDate(d, Session.getScriptTimeZone(), \"yyyy/MM/dd\") : String(d || \"\").trim();\n}\n\n// 目前場次＝「⚙️場次」第一欄打勾的那一列（沒有勾就回傳 null，大螢幕會顯示「準備中」）\nfunction currentSession_() {\n  const sh = ss_().getSheetByName(SHEET_SESSIONS);\n  if (!sh || sh.getLastRow() < 2) return null;\n  const rows = sh.getRange(2, 1, sh.getLastRow() - 1, SESSION_HEADERS.length).getValues()\n    .map(r => ({\n      on: r[0] === true,\n      name: String(r[1] || \"\").trim(),\n      date: fmtDate_(r[2]),\n      code: String(r[3] || \"\").trim(),\n      note: String(r[4] || \"\").trim()\n    }))\n    .filter(r => r.name || r.code);\n  const pick = rows.find(r => r.on);\n  if (!pick) return null;\n  if (!pick.name) pick.name = pick.code;\n  return { name: pick.name, date: pick.date, code: pick.code };\n}\n\nfunction boardUrl_(s) {\n  if (s.boardUrl) return s.boardUrl;\n  try { return ScriptApp.getService().getUrl() || \"\"; } catch (e) { return \"\"; }\n}\n\n\n// =====================================================================\n//  二、網頁應用程式（手寫板＝預設；大螢幕＝?view=wall）\n// =====================================================================\n\nfunction doGet(e) {\n  // 1.1：Netlify 手寫板讀取標題、題目、目前場次\n  if (e && e.parameter && e.parameter.api === \"info\") return json_(getBoardInfo());\n  const view = String((e && e.parameter && e.parameter.view) || \"\").toLowerCase();\n  const isWall = view === \"wall\";\n  let title = DEFAULTS.title;\n  try { title = getSettings_().title; } catch (err) {}\n  return HtmlService.createHtmlOutputFromFile(isWall ? \"Wall\" : \"Board\")\n    .setTitle(isWall ? title + \"｜大螢幕\" : title)\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)\n    .addMetaTag(\"viewport\", \"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\");\n}\n\n// 1.1：Netlify 手寫板送出作品（body 是 JSON 文字：{ action: \"save\", payload: {...} }）\nfunction doPost(e) {\n  let out;\n  try {\n    const body = JSON.parse((e && e.postData && e.postData.contents) || \"{}\");\n    out = body.action === \"save\" ? saveDoodle(body.payload) : { success: false, message: \"不認得的動作\" };\n  } catch (err) {\n    out = { success: false, message: \"資料格式不正確：\" + err.message };\n  }\n  return json_(out);\n}\n\nfunction json_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n\n// 手寫板開啟時：標題、題目、目前場次\nfunction getBoardInfo() {\n  try {\n    const s = getSettings_();\n    const sess = currentSession_();\n    return { success: true, title: s.title, prompt: s.prompt, session: sess ? { name: sess.name } : null };\n  } catch (e) {\n    return { success: false, message: \"系統還沒設定完成，請通知主持人：\" + e.message };\n  }\n}\n\n// 大螢幕每隔幾秒呼叫一次：只回傳文字與圖片 ID（圖片另外抓，避免每次都傳大量資料）\nfunction getWallData() {\n  try {\n    const cache = CacheService.getScriptCache();\n    const hit = cache.get(WALL_CACHE_KEY);\n    if (hit) return JSON.parse(hit);\n\n    const s = getSettings_();\n    const sess = currentSession_();\n    let cards = [];\n    if (sess) {\n      const sh = ss_().getSheetByName(SHEET_LOG);\n      if (sh && sh.getLastRow() >= 2) {\n        cards = sh.getRange(2, 1, sh.getLastRow() - 1, LOG_HEADERS.length).getValues()\n          .filter(r => String(r[L.SESSION - 1]).trim() === sess.name)\n          .filter(r => r[L.SHOW - 1] !== false && String(r[L.SHOW - 1]).toUpperCase() !== \"FALSE\")\n          .map(r => {\n            const t = r[L.TIME - 1] instanceof Date ? r[L.TIME - 1].getTime() : 0;\n            const fid = extractFileId_(r[L.IMG - 1]);\n            return {\n              id: fid || (\"T\" + t + \"_\" + String(r[L.NAME - 1]).length),\n              img: !!fid,\n              name: String(r[L.NAME - 1] || \"\").trim(),\n              mood: String(r[L.MOOD - 1] || \"\").trim(),\n              t: t\n            };\n          });\n      }\n    }\n    const out = {\n      success: true,\n      title: s.title,\n      session: sess,\n      cfg: { cardSec: s.cardSec, inviteSec: s.inviteSec, every: s.every, pollSec: s.pollSec },\n      boardUrl: boardUrl_(s),\n      cards: cards\n    };\n    try { cache.put(WALL_CACHE_KEY, JSON.stringify(out), 3); } catch (e) {}\n    return out;\n  } catch (e) {\n    return { success: false, message: e.message };\n  }\n}\n\n// 大螢幕抓圖片：只給「目前場次、正在投影」的作品，不能拿來讀雲端硬碟裡的其他檔案\nfunction getCardImages(ids) {\n  const out = {};\n  try {\n    const allowed = {};\n    ((getWallData() || {}).cards || []).forEach(c => { if (c.img) allowed[c.id] = true; });\n    const cache = CacheService.getScriptCache();\n    (Array.isArray(ids) ? ids : []).slice(0, 20).forEach(raw => {\n      const id = String(raw || \"\");\n      if (!allowed[id]) return;\n      const hit = cache.get(\"IMG_\" + id);\n      if (hit) { out[id] = hit; return; }\n      try {\n        const b = DriveApp.getFileById(id).getBlob();\n        const d = \"data:\" + (b.getContentType() || \"image/jpeg\") + \";base64,\" + Utilities.base64Encode(b.getBytes());\n        out[id] = d;\n        if (d.length < 95000) cache.put(\"IMG_\" + id, d, 21600);\n      } catch (e) {}\n    });\n  } catch (e) {}\n  return out;\n}\n\n// 手寫板送出：p = { image: dataURL（可空白）, name, mood, device: { id, info } }\nfunction saveDoodle(p) {\n  const lock = LockService.getScriptLock();\n  let locked = false;\n  try {\n    p = p || {};\n    const name = clean_(p.name, 16);\n    const mood = clean_(p.mood, 80);\n    const image = typeof p.image === \"string\" ? p.image : \"\";\n    if (!image && !mood) throw new Error(\"請畫點什麼，或打幾個字再送出喔！\");\n    if (image && !/^data:image\\/(png|jpeg);base64,/.test(image)) throw new Error(\"圖片格式不正確\");\n    if (image.length > 2 * 1024 * 1024) throw new Error(\"圖片太大了，請清掉一些筆跡再送出\");\n\n    const sess = currentSession_();\n    if (!sess) throw new Error(\"主持人還沒開啟本場次，請稍等一下再送出。\");\n\n    const dev = p.device && typeof p.device === \"object\" ? p.device : {};\n    const devId = String(dev.id || \"\").replace(/[^\\w\\-]/g, \"\").slice(0, 60);\n    const devInfo = String(dev.info || \"未知載具\").replace(/[\\r\\n]/g, \" \").slice(0, 60);\n    const cache = CacheService.getScriptCache();\n    if (devId && cache.get(\"CD_\" + devId)) throw new Error(`送出得太快了，請 ${SUBMIT_COOLDOWN_SEC} 秒後再試一次。`);\n\n    lock.waitLock(20000);\n    locked = true;\n    let url = \"\";\n    if (image) {\n      const mime = image.substring(5, image.indexOf(\";\"));\n      const stamp = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), \"MMdd-HHmmss\");\n      const blob = Utilities.newBlob(Utilities.base64Decode(image.split(\",\")[1]), mime,\n        `畫押_${stamp}_${Math.random().toString(36).slice(2, 6)}.${mime === \"image/png\" ? \"png\" : \"jpg\"}`);\n      url = sessionFolder_(sess.name).createFile(blob).getUrl();\n    }\n    const sh = ensureLogSheet_();\n    sh.appendRow([new Date(), sess.name, cellSafe_(name), cellSafe_(mood), url, true, devInfo]);\n    sh.getRange(sh.getLastRow(), L.SHOW).insertCheckboxes().check();\n    SpreadsheetApp.flush();\n    lock.releaseLock();\n    locked = false;\n\n    cache.remove(WALL_CACHE_KEY);\n    if (devId) cache.put(\"CD_\" + devId, \"1\", SUBMIT_COOLDOWN_SEC);\n    return { success: true, session: sess.name };\n  } catch (e) {\n    return { success: false, message: e.message };\n  } finally {\n    if (locked) { try { lock.releaseLock(); } catch (x) {} }\n  }\n}\n\nfunction clean_(v, max) {\n  const t = String(v || \"\").normalize(\"NFC\")\n    .replace(/[​-‍﻿]/g, \"\")\n    .replace(/\\s+/g, \" \").trim();\n  return Array.from(t).slice(0, max).join(\"\");\n}\n\n// 開頭是 = + - @ 的文字，試算表會當成公式：前面加 ' 讓它保持純文字\nfunction cellSafe_(t) { return /^[=+\\-@]/.test(t) ? \"'\" + t : t; }\n\nfunction extractFileId_(url) {\n  const m = String(url || \"\").match(/[-\\w]{25,}/);\n  return m ? m[0] : \"\";\n}\n\n\n// =====================================================================\n//  三、試算表後台：選單、分頁建立、場次切換\n// =====================================================================\n\nfunction onOpen() {\n  SpreadsheetApp.getUi().createMenu(\"🎨 畫押牆\")\n    .addItem(\"① 開始設定（建立分頁、檢查 ID）\", \"menuSetup\")\n    .addItem(\"② 📺 取得大螢幕與手寫板網址\", \"menuUrls\")\n    .addSeparator()\n    .addItem(\"📂 打開畫押圖片資料夾\", \"menuOpenFolder\")\n    .addToUi();\n}\n\n// 「⚙️場次」勾一個，其他自動取消（一次只有一個目前場次）\nfunction onEdit(e) {\n  try {\n    if (!e || !e.range) return;\n    const sh = e.range.getSheet();\n    if (sh.getName() !== SHEET_SESSIONS) return;\n    if (e.range.getColumn() !== 1 || e.range.getNumColumns() !== 1 || e.range.getNumRows() !== 1 || e.range.getRow() < 2) return;\n    if (e.range.getValue() !== true) return;\n    const n = sh.getLastRow() - 1;\n    if (n < 1) return;\n    const r0 = e.range.getRow();\n    const vals = sh.getRange(2, 1, n, 1).getValues();\n    let changed = false;\n    const out = vals.map((v, i) => {\n      if (i + 2 !== r0 && v[0] === true) { changed = true; return [false]; }\n      return [v[0]];\n    });\n    if (changed) sh.getRange(2, 1, n, 1).setValues(out);\n    try { CacheService.getScriptCache().remove(WALL_CACHE_KEY); } catch (x) {}\n    const name = String(sh.getRange(r0, 2).getValue() || \"\").trim();\n    e.source.toast(`大螢幕約 5 秒後切換到「${name || \"這一場\"}」。`, \"✅ 目前場次已切換\", 6);\n  } catch (err) {}\n}\n\nfunction ensureLogSheet_() {\n  const ss = ss_();\n  let sh = ss.getSheetByName(SHEET_LOG);\n  if (sh) return sh;\n  sh = ss.insertSheet(SHEET_LOG);\n  sh.getRange(1, 1, 1, LOG_HEADERS.length).setValues([LOG_HEADERS]).setFontWeight(\"bold\").setBackground(\"#FDE68A\").setWrap(true);\n  sh.getRange(1, L.SHOW).setNote(\"取消勾選＝這張作品立刻從大螢幕下架（約 5 秒內生效）。\\n資料與圖片都還在，重新勾選就會再出現。\");\n  [150, 220, 120, 320, 260, 150, 160].forEach((w, i) => sh.setColumnWidth(i + 1, w));\n  sh.setFrozenRows(1);\n  return sh;\n}\n\nfunction setupCore_() {\n  const ss = ss_();\n  const notes = [];\n\n  // ⚙️系統設定\n  let st = ss.getSheetByName(SHEET_SETTINGS);\n  if (!st) {\n    st = ss.insertSheet(SHEET_SETTINGS);\n    st.getRange(1, 1, 1, 3).setValues([[\"設定項目\", \"設定值\", \"說明\"]]).setFontWeight(\"bold\").setBackground(\"#E3F2FD\");\n    st.setColumnWidth(1, 260); st.setColumnWidth(2, 360); st.setColumnWidth(3, 560);\n    st.setFrozenRows(1);\n    notes.push(\"已建立「⚙️系統設定」。\");\n  }\n  const haveKeys = st.getRange(1, 1, Math.max(st.getLastRow(), 1), 1).getValues().map(r => String(r[0]).trim());\n  SETTING_ROWS.forEach(row => { if (haveKeys.indexOf(row[0]) < 0) st.appendRow(row); });\n  st.getRange(1, 1, st.getLastRow(), 3).setWrap(true).setVerticalAlignment(\"top\");\n\n  // ⚙️場次\n  let ses = ss.getSheetByName(SHEET_SESSIONS);\n  if (!ses) {\n    ses = ss.insertSheet(SHEET_SESSIONS, 0);\n    ses.getRange(1, 1, 1, SESSION_HEADERS.length).setValues([SESSION_HEADERS]).setFontWeight(\"bold\").setBackground(\"#E8F5E9\").setWrap(true);\n    ses.getRange(2, 1, 40, 1).insertCheckboxes();\n    ses.getRange(2, 2, 1, 4).setValues([[\"（範例）下午場 GAS 部署工作坊\", new Date(), \"vms7f7x6\", \"換場次：新增一列、填好代碼，再把勾勾移到那一列\"]]);\n    ses.getRange(2, 1).check();\n    ses.getRange(2, 3, 40, 1).setNumberFormat(\"yyyy/mm/dd\");\n    ses.getRange(2, 4, 40, 1).setNumberFormat(\"@\").setFontFamily(\"Roboto Mono\").setFontWeight(\"bold\");\n    [150, 320, 120, 200, 420].forEach((w, i) => ses.setColumnWidth(i + 1, w));\n    ses.getRange(1, 1).setNote(\"一次只能勾一個（勾新的，舊的會自動取消）。\\n大螢幕與手寫板都以打勾的這一場為準。\");\n    ses.setFrozenRows(1);\n    notes.push(\"已建立「⚙️場次」，並放了一列範例（代碼 vms7f7x6），請改成真正的場次與代碼。\");\n  }\n\n  ensureLogSheet_();\n  notes.push(\"「📝畫押紀錄」已就緒：取消勾選「投影」就能從大螢幕下架。\");\n  return notes;\n}\n\nfunction menuSetup() {\n  const ui = SpreadsheetApp.getUi();\n  const lines = [];\n  let ok = true;\n  try { lines.push(\"✅ 試算表：\" + ss_().getName()); }\n  catch (e) { ok = false; lines.push(\"❌ 試算表：SHEET_ID 沒有設定、不正確，或你沒有權限\"); }\n  try { lines.push(\"✅ 雲端資料夾：\" + folder_().getName()); }\n  catch (e) { ok = false; lines.push(\"❌ 雲端資料夾：FOLDER_ID 沒有設定、不正確，或你沒有權限\"); }\n  if (!ok) {\n    ui.alert(\"① 開始設定：ID 還沒設定好\", lines.join(\"\\n\") +\n      \"\\n\\n請到 Apps Script 左側「⚙️ 專案設定 → 指令碼屬性」新增：\\nSHEET_ID＝試算表網址 /d/ 和 /edit 中間那一串\\nFOLDER_ID＝雲端資料夾網址 /folders/ 後面那一串\\n\\n改好後再按一次「①」。\",\n      ui.ButtonSet.OK);\n    return;\n  }\n  try { lines.push(\"\", ...setupCore_()); } catch (e) { lines.push(\"❌ \" + e.message); }\n  const sess = currentSession_();\n  lines.push(\"\", sess ? `🎯 目前場次：${sess.name}（代碼 ${sess.code || \"尚未填寫\"}）` : \"🎯 還沒有勾選目前場次：請到「⚙️場次」勾一列。\");\n  lines.push(\"\", \"下一步：部署成網頁應用程式（執行身分：我／存取權：所有人），再按「② 取得網址」。\");\n  ui.alert(\"✅ ① 開始設定：完成\", lines.join(\"\\n\"), ui.ButtonSet.OK);\n}\n\nfunction menuUrls() {\n  const ui = SpreadsheetApp.getUi();\n  let url = \"\";\n  try { url = ScriptApp.getService().getUrl() || \"\"; } catch (e) {}\n  if (!url) {\n    ui.alert(\"還沒有部署\",\n      \"請到 Apps Script 右上角「部署 → 新增部署作業」：\\n類型：網頁應用程式\\n執行身分：我\\n誰可以存取：所有人\\n\\n部署完成後，再按一次這個選單。\", ui.ButtonSet.OK);\n    return;\n  }\n  const s = getSettings_();\n  // ⚠️ getUrl() 在新增過部署後，常回傳已失效的部署 ID；\n  //    老師在「⚙️系統設定」貼的 /exec 網址才是真正可用的，大螢幕網址一律以它為基礎。\n  const pasted = /script\\.google\\.com\\/.*\\/exec/i.test(s.boardUrl) ? s.boardUrl.split(\"?\")[0] : \"\";\n  const base = s.execUrl || pasted || url;\n  const board = s.boardUrl || base;\n  const wall = base + \"?view=wall\";\n  const warn = (s.execUrl || pasted) ? \"\" :\n    `<p style=\"font-size:13px;color:#9b1c1c;background:#fdf2f2;padding:8px 10px;border-radius:8px\">⚠️ 自動取得的網址有時會失效。` +\n    `請到「部署 → 管理部署作業」複製網頁應用程式網址（結尾是 /exec），貼到「⚙️系統設定」的「GAS 部署網址」，再按一次這個選單。<\/p>`;\n  const box = (label, v, tip) =>\n    `<div style=\"margin:0 0 16px\"><div style=\"font-weight:700;margin-bottom:4px\">${label}<\/div>` +\n    `<input readonly value=\"${esc_(v)}\" onclick=\"this.select()\" style=\"width:100%;padding:8px;font-size:13px;border:1px solid #bbb;border-radius:8px;box-sizing:border-box\">` +\n    `<div style=\"font-size:12px;color:#666;margin-top:4px\">${tip} ｜ <a href=\"${esc_(v)}\" target=\"_blank\">在新分頁打開<\/a><\/div><\/div>`;\n  const html = `<div style=\"font-family:sans-serif;font-size:14px;line-height:1.6\">` + warn +\n    box(\"📺 大螢幕（投影用）\", wall, \"開好後按 F 或 F11 全螢幕\") +\n    box(\"✍️ 手寫板（QR Code／貼到 Classroom 公告）\", board, /netlify|github\\.io/i.test(board) ? \"✅ 外部手寫板：任何帳號都能開\" : \"筆電已加入 Classroom 的師長點這個連結參與\") +\n    box(\"🔌 GAS 部署網址（貼進 Netlify 手寫板的 API_URL）\", base, \"Netlify 的 index.html 最上方那一行要貼這個\") +\n    `<p style=\"font-size:12px;color:#888\">改了程式碼後，記得「部署 → 管理部署作業 → 編輯 → 新版本」，網址不變。<\/p><\/div>`;\n  ui.showModalDialog(HtmlService.createHtmlOutput(html).setWidth(580).setHeight(470), \"② 大螢幕與手寫板網址\");\n}\n\nfunction menuOpenFolder() {\n  const ui = SpreadsheetApp.getUi();\n  try {\n    const url = folder_().getUrl();\n    ui.showModalDialog(HtmlService.createHtmlOutput(\n      `<div style=\"font-family:sans-serif;font-size:15px;line-height:2\">📁 <a href=\"${url}\" target=\"_blank\">點我打開畫押圖片資料夾<\/a>` +\n      `<p style=\"font-size:13px;color:#555\">每一場會自動建立「🖼️ 場次名稱」資料夾。<\/p><\/div>`).setWidth(420).setHeight(140), \"📂 雲端資料夾\");\n  } catch (e) {\n    ui.alert(\"❌ \" + e.message);\n  }\n}\n\nfunction esc_(s) {\n  return String(s === null || s === undefined ? \"\" : s)\n    .replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\").replace(/\"/g, \"&quot;\");\n}", "board": "<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n  <title>午後暖身・畫押牆<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap\" rel=\"stylesheet\">\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <style>\n    body {\n      font-family: \"Noto Sans TC\", \"PingFang TC\", \"Microsoft JhengHei\", sans-serif;\n      background-color: #f6f5f2;\n      color: #2c353d;\n      letter-spacing: 0.035em;\n      line-height: 1.75;\n      overscroll-behavior: none;\n      -webkit-font-smoothing: antialiased;\n    }\n    .canvas-wrapper {\n      position: relative;\n      width: 100%;\n      background: #ffffff;\n      border-radius: 1rem;\n      overflow: hidden;\n      touch-action: none;\n      box-shadow: inset 0 1px 3px rgba(0,0,0,.04);\n    }\n    canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }\n    .tool-btn { letter-spacing: .04em; }\n    .tool-btn.active {\n      background-color: #334e68; color: #fff; border-color: #243b53;\n      box-shadow: 0 2px 8px rgba(36,59,83,.22);\n    }\n    .color-dot { width: 28px; height: 28px; border-radius: 9999px; border: 2px solid transparent; transition: transform .18s; }\n    .color-dot.active { transform: scale(1.18); border-color: #334e68; box-shadow: 0 0 0 2px #fff inset; }\n    .stamp-btn { font-size: 26px; line-height: 1; width: 46px; height: 46px; border-radius: 12px; border: 2px solid #e7e5e4; background: #faf9f6; transition: transform .15s; }\n    .stamp-btn.active { border-color: #334e68; background: #f0f4f8; transform: scale(1.08); }\n    @keyframes pop { 0%{transform:scale(.6);opacity:0} 70%{transform:scale(1.08);opacity:1} 100%{transform:scale(1)} }\n    .pop { animation: pop .5s ease-out; }\n  <\/style>\n<\/head>\n<body class=\"min-h-screen pb-16\">\n\n  <header class=\"bg-gradient-to-r from-[#243b53] via-[#2b445e] to-[#334e68] text-stone-100 shadow-sm sticky top-0 z-40\">\n    <div class=\"max-w-xl mx-auto px-4 py-3 flex items-center gap-3\">\n      <img src=\"https://i.meee.com.tw/QRjtoSp.png\" alt=\"優履 UNI\" class=\"w-11 h-11 rounded-full bg-white p-0.5 object-contain shrink-0\">\n      <div class=\"min-w-0\">\n        <h1 id=\"appTitle\" class=\"text-lg font-bold tracking-wider text-stone-50 leading-tight\">午後暖身・畫押牆<\/h1>\n        <p id=\"sessionText\" class=\"text-xs text-stone-300 tracking-wide truncate\">連線中…<\/p>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main class=\"max-w-xl mx-auto px-4 mt-5 space-y-5\">\n\n    <div id=\"mockNotice\" class=\"hidden rounded-2xl bg-[#fbf8f1] border border-[#e2d6b5] px-4 py-3 text-xs text-[#5c4d32] leading-relaxed\">\n      🧪 目前是「尚未部署的預覽模擬版」：可以試畫、試送出；部署到 Google Apps Script 後會自動連到試算表與大螢幕。\n    <\/div>\n\n    <div id=\"banner\" class=\"hidden rounded-xl px-4 py-3 border text-sm font-medium\"><\/div>\n\n    <\u0021-- ===== 作答畫面 ===== -->\n    <section id=\"formView\" class=\"space-y-5\">\n\n      <div class=\"bg-white rounded-2xl shadow-sm border border-stone-200/90 p-5\">\n        <p class=\"text-xs font-bold text-[#486581] tracking-wider mb-1.5\">🌤️ 午後暖身任務<\/p>\n        <p id=\"promptText\" class=\"text-base font-bold text-slate-800 leading-relaxed\">請用手指頭畫個笑臉、或打字寫下此刻的心情，再加上您的隨便簽名 ✍️<\/p>\n        <p class=\"text-xs text-slate-500 mt-2\">送出後，抬頭看大螢幕——約 5 秒您的作品就會出現！<\/p>\n      <\/div>\n\n      <div class=\"bg-white rounded-2xl shadow-sm border border-stone-200/90 p-4 space-y-3\">\n        <div class=\"flex flex-wrap items-center gap-2\">\n          <button type=\"button\" id=\"toolPen\" onclick=\"setTool('pen')\" class=\"tool-btn active px-3 py-1.5 rounded-lg border border-stone-300 text-xs font-semibold\">✏️ 畫筆<\/button>\n          <button type=\"button\" id=\"toolStamp\" onclick=\"setTool('stamp')\" class=\"tool-btn px-3 py-1.5 rounded-lg border border-stone-300 text-xs font-semibold\">😊 蓋章<\/button>\n          <button type=\"button\" id=\"toolEraser\" onclick=\"setTool('eraser')\" class=\"tool-btn px-3 py-1.5 rounded-lg border border-stone-300 text-xs font-semibold\">🧽 橡皮擦<\/button>\n          <span class=\"flex-1\"><\/span>\n          <button type=\"button\" onclick=\"undo()\" class=\"px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-semibold\">↩️ 復原<\/button>\n          <button type=\"button\" onclick=\"clearBoard()\" class=\"px-3 py-1.5 rounded-lg bg-[#fdf2f2] hover:bg-[#fbd5d5] text-[#9b1c1c] text-xs font-semibold\">🗑️ 清空<\/button>\n        <\/div>\n\n        <div id=\"penRow\" class=\"flex flex-wrap items-center gap-4\">\n          <div class=\"flex items-center gap-2.5\">\n            <button type=\"button\" onclick=\"setColor('#262626', this)\" class=\"color-dot active\" style=\"background:#262626\" title=\"墨黑\"><\/button>\n            <button type=\"button\" onclick=\"setColor('#2b4c7e', this)\" class=\"color-dot\" style=\"background:#2b4c7e\" title=\"鋼筆藍\"><\/button>\n            <button type=\"button\" onclick=\"setColor('#9e2a2b', this)\" class=\"color-dot\" style=\"background:#9e2a2b\" title=\"胭脂紅\"><\/button>\n            <button type=\"button\" onclick=\"setColor('#2d6a4f', this)\" class=\"color-dot\" style=\"background:#2d6a4f\" title=\"松柏綠\"><\/button>\n            <button type=\"button\" onclick=\"setColor('#d97706', this)\" class=\"color-dot\" style=\"background:#d97706\" title=\"暖陽橘\"><\/button>\n          <\/div>\n          <label class=\"flex items-center gap-2 text-xs text-slate-600\">粗細\n            <input type=\"range\" id=\"sizeSlider\" min=\"2\" max=\"10\" value=\"4\" class=\"w-24 accent-[#334e68]\">\n          <\/label>\n        <\/div>\n\n        <div id=\"stampRow\" class=\"hidden flex flex-wrap gap-2\">\n          <button type=\"button\" class=\"stamp-btn active\" onclick=\"setStamp('😊', this)\">😊<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('😆', this)\">😆<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('🥰', this)\">🥰<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('😴', this)\">😴<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('☕', this)\">☕<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('💪', this)\">💪<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('👍', this)\">👍<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('🎉', this)\">🎉<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('🌈', this)\">🌈<\/button>\n          <button type=\"button\" class=\"stamp-btn\" onclick=\"setStamp('❤️', this)\">❤️<\/button>\n        <\/div>\n\n        <p id=\"toolHint\" class=\"text-xs text-[#486581] font-medium\">✏️ 直接在下方白紙上畫：一個笑臉、一個簽名，都好！<\/p>\n\n        <div id=\"canvasWrap\" class=\"canvas-wrapper border border-stone-300\">\n          <canvas id=\"board\"><\/canvas>\n        <\/div>\n      <\/div>\n\n      <div class=\"bg-white rounded-2xl shadow-sm border border-stone-200/90 p-5 space-y-4\">\n        <div>\n          <label for=\"moodInput\" class=\"block text-xs font-semibold text-slate-600 tracking-wider mb-1.5\">⌨️ 今天的心情（想打字也可以，最多 60 字）<\/label>\n          <textarea id=\"moodInput\" rows=\"2\" maxlength=\"60\" placeholder=\"例如：吃飽了有點睏，但很期待下午的 GAS！\"\n            class=\"w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-base bg-[#faf9f6] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#486581]\"><\/textarea>\n        <\/div>\n        <div>\n          <label for=\"nameInput\" class=\"block text-xs font-semibold text-slate-600 tracking-wider mb-1.5\">🖋️ 姓名或暱稱（也可以直接簽在白紙上）<\/label>\n          <input type=\"text\" id=\"nameInput\" maxlength=\"12\" placeholder=\"例如：善化王老師\"\n            class=\"w-full rounded-xl border border-stone-300 px-3.5 py-2.5 text-base bg-[#faf9f6] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#486581]\">\n        <\/div>\n        <p class=\"text-[11px] text-slate-500 leading-relaxed\">📢 送出即表示同意這張作品投影在本場工作坊的大螢幕上；工作坊結束後僅供團隊留存紀錄。<\/p>\n        <button type=\"button\" id=\"submitBtn\" onclick=\"submitDoodle()\"\n          class=\"w-full py-3.5 rounded-xl bg-[#2d6a4f] hover:bg-[#1b4332] active:bg-[#14532d] text-stone-50 font-bold tracking-wider text-base shadow-sm transition\">\n          🚀 送上大螢幕\n        <\/button>\n      <\/div>\n    <\/section>\n\n    <\u0021-- ===== 送出成功 ===== -->\n    <section id=\"doneView\" class=\"hidden\">\n      <div class=\"bg-white rounded-2xl shadow-sm border border-stone-200/90 p-8 text-center space-y-4\">\n        <div class=\"text-6xl pop\">🎉<\/div>\n        <h2 class=\"text-xl font-bold text-[#243b53] tracking-wider\">已送上大螢幕！<\/h2>\n        <p class=\"text-sm text-slate-600 leading-relaxed\">抬頭看看前面的螢幕，<br>約 5 秒您的作品就會出現 👀<\/p>\n        <p class=\"text-xs text-slate-500 leading-relaxed bg-[#f0f4f8] rounded-xl p-3\">\n          💡 剛剛這一下：您的手機 → Google 試算表 → 大螢幕。<br>今天下午，我們就要親手做出這樣的工具。\n        <\/p>\n        <button type=\"button\" onclick=\"drawAgain()\" class=\"px-6 py-2.5 rounded-xl bg-[#334e68] hover:bg-[#243b53] text-white text-sm font-semibold tracking-wider\">\n          ✏️ 再畫一張\n        <\/button>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <script>\n    const IS_GAS = (typeof google !== 'undefined' && google.script && google.script.run);\n    const W = 720, H = 540;           // 畫布實際像素（4:3）\n    const OUT_W = 640, OUT_H = 480;   // 送出時縮小，大螢幕載入更快\n\n    let tool = 'pen', color = '#262626', stamp = '😊';\n    let drawing = false, lastX = 0, lastY = 0, dirty = false;\n    let history = [];\n    let canvas, ctx;\n\n    function call(method, args, ok, fail) {\n      if (IS_GAS) {\n        let r = google.script.run.withSuccessHandler(ok);\n        if (fail) r = r.withFailureHandler(fail);\n        r[method].apply(r, args || []);\n        return;\n      }\n      setTimeout(() => {\n        if (method === 'getBoardInfo') ok({ success: true, title: '午後暖身・畫押牆（預覽模擬）', prompt: '', session: { name: '（範例）下午場 GAS 部署工作坊' } });\n        else if (method === 'saveDoodle') ok({ success: true, session: '（範例）下午場 GAS 部署工作坊' });\n      }, 400);\n    }\n\n    window.addEventListener('DOMContentLoaded', () => {\n      canvas = document.getElementById('board');\n      ctx = canvas.getContext('2d');\n      canvas.width = W; canvas.height = H;\n      paintPaper();\n      pushHistory();\n      canvas.addEventListener('pointerdown', onDown);\n      canvas.addEventListener('pointermove', onMove);\n      canvas.addEventListener('pointerup', onUp);\n      canvas.addEventListener('pointercancel', onUp);\n      if (!IS_GAS) document.getElementById('mockNotice').classList.remove('hidden');\n      loadInfo();\n    });\n\n    function loadInfo() {\n      call('getBoardInfo', [], res => {\n        if (!res || !res.success) { showBanner((res && res.message) || '讀取失敗', 'error'); return; }\n        if (res.title) { document.getElementById('appTitle').textContent = res.title; document.title = res.title; }\n        if (res.prompt) document.getElementById('promptText').textContent = res.prompt;\n        document.getElementById('sessionText').textContent = res.session\n          ? '📍 ' + res.session.name\n          : '⏳ 主持人還沒開啟場次，可以先畫，等一下再送出';\n      }, err => showBanner('連線錯誤：' + err.message, 'error'));\n    }\n\n    // ====== 畫布 ======\n    function paintPaper() {\n      ctx.fillStyle = '#ffffff';\n      ctx.fillRect(0, 0, W, H);\n    }\n\n    function coords(e) {\n      const r = canvas.getBoundingClientRect();\n      return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };\n    }\n\n    function brush() {\n      const v = Number(document.getElementById('sizeSlider').value || 4);\n      return tool === 'eraser' ? v * 7 : v * 1.4;\n    }\n\n    function onDown(e) {\n      if (e.button !== undefined && e.button !== 0) return;\n      e.preventDefault();\n      const p = coords(e);\n      if (tool === 'stamp') { placeStamp(p.x, p.y); return; }\n      try { canvas.setPointerCapture(e.pointerId); } catch (x) {}\n      drawing = true;\n      lastX = p.x; lastY = p.y;\n      if (tool === 'pen') dirty = true;\n      ctx.beginPath();\n      ctx.arc(p.x, p.y, brush() / 2, 0, Math.PI * 2);\n      ctx.fillStyle = tool === 'eraser' ? '#ffffff' : color;\n      ctx.fill();\n    }\n\n    function onMove(e) {\n      if (!drawing) return;\n      e.preventDefault();\n      const p = coords(e);\n      ctx.beginPath();\n      ctx.moveTo(lastX, lastY);\n      ctx.lineTo(p.x, p.y);\n      ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;\n      ctx.lineWidth = brush();\n      ctx.lineCap = 'round';\n      ctx.lineJoin = 'round';\n      ctx.stroke();\n      lastX = p.x; lastY = p.y;\n    }\n\n    function onUp() {\n      if (!drawing) return;\n      drawing = false;\n      pushHistory();\n    }\n\n    function placeStamp(x, y) {\n      const v = Number(document.getElementById('sizeSlider').value || 4);\n      const size = 56 + v * 12;\n      ctx.save();\n      ctx.font = `${size}px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif`;\n      ctx.textAlign = 'center';\n      ctx.textBaseline = 'middle';\n      ctx.fillText(stamp, x, y);\n      ctx.restore();\n      dirty = true;\n      pushHistory();\n    }\n\n    function pushHistory() {\n      history.push({ url: canvas.toDataURL('image/png'), dirty: dirty });\n      if (history.length > 15) history.shift();\n    }\n\n    function undo() {\n      if (history.length <= 1) return;\n      history.pop();\n      const prev = history[history.length - 1];\n      const img = new Image();\n      img.onload = () => { paintPaper(); ctx.drawImage(img, 0, 0); };\n      img.src = prev.url;\n      dirty = prev.dirty;\n    }\n\n    function clearBoard() {\n      paintPaper();\n      dirty = false;\n      pushHistory();\n    }\n\n    function setTool(t) {\n      tool = t;\n      ['Pen', 'Stamp', 'Eraser'].forEach(n => document.getElementById('tool' + n).classList.toggle('active', t === n.toLowerCase()));\n      document.getElementById('stampRow').classList.toggle('hidden', t !== 'stamp');\n      const hint = document.getElementById('toolHint');\n      if (t === 'stamp') {\n        hint.textContent = '😊 先選一個表情章，再點白紙任何位置蓋上去（下方滑桿可調大小）。筆電沒有觸控也能輕鬆完成！';\n        canvas.style.cursor = 'copy';\n      } else if (t === 'eraser') {\n        hint.textContent = '🧽 塗抹即可擦掉，或按「↩️ 復原」。';\n        canvas.style.cursor = 'cell';\n      } else {\n        hint.textContent = '✏️ 直接在下方白紙上畫：一個笑臉、一個簽名，都好！';\n        canvas.style.cursor = 'crosshair';\n      }\n    }\n\n    function setColor(c, el) {\n      color = c;\n      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));\n      if (el) el.classList.add('active');\n      if (tool !== 'pen') setTool('pen');\n    }\n\n    function setStamp(s, el) {\n      stamp = s;\n      document.querySelectorAll('.stamp-btn').forEach(d => d.classList.remove('active'));\n      if (el) el.classList.add('active');\n    }\n\n    // ====== 送出 ======\n    function submitDoodle() {\n      const name = document.getElementById('nameInput').value.trim();\n      const mood = document.getElementById('moodInput').value.trim();\n      if (!dirty && !mood) { showBanner('請先在白紙上畫點什麼，或打幾個字再送出喔！', 'error'); return; }\n\n      let image = '';\n      if (dirty) {\n        const out = document.createElement('canvas');\n        out.width = OUT_W; out.height = OUT_H;\n        const o = out.getContext('2d');\n        o.fillStyle = '#ffffff'; o.fillRect(0, 0, OUT_W, OUT_H);\n        o.drawImage(canvas, 0, 0, OUT_W, OUT_H);\n        image = out.toDataURL('image/jpeg', 0.82);\n      }\n\n      const btn = document.getElementById('submitBtn');\n      btn.disabled = true;\n      btn.textContent = '⏳ 正在送上大螢幕…';\n      hideBanner();\n      call('saveDoodle', [{ image: image, name: name, mood: mood, device: deviceIdentity() }], res => {\n        btn.disabled = false;\n        btn.textContent = '🚀 送上大螢幕';\n        if (res && res.success) {\n          document.getElementById('formView').classList.add('hidden');\n          document.getElementById('doneView').classList.remove('hidden');\n          window.scrollTo({ top: 0, behavior: 'smooth' });\n        } else {\n          showBanner((res && res.message) || '送出失敗，請再試一次', 'error');\n        }\n      }, err => {\n        btn.disabled = false;\n        btn.textContent = '🚀 送上大螢幕';\n        showBanner('送出失敗：' + err.message, 'error');\n      });\n    }\n\n    function drawAgain() {\n      clearBoard();\n      history = [];\n      pushHistory();\n      document.getElementById('moodInput').value = '';\n      document.getElementById('doneView').classList.add('hidden');\n      document.getElementById('formView').classList.remove('hidden');\n    }\n\n    function deviceIdentity() {\n      let id = '';\n      try {\n        id = localStorage.getItem('DOODLE_WALL_DEVICE_ID') || '';\n        if (!id) {\n          id = 'DEV-' + Math.random().toString(36).substring(2, 8).toUpperCase();\n          localStorage.setItem('DOODLE_WALL_DEVICE_ID', id);\n        }\n      } catch (e) {\n        if (!window.__devId) window.__devId = 'DEV-' + Math.random().toString(36).substring(2, 8).toUpperCase();\n        id = window.__devId;\n      }\n      const ua = navigator.userAgent || '';\n      let os = '一般設備';\n      if (/iPad/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) os = 'iPad';\n      else if (/iPhone/i.test(ua)) os = 'iPhone';\n      else if (/Android/i.test(ua)) os = /Mobile/i.test(ua) ? 'Android 手機' : 'Android 平板';\n      else if (/CrOS/i.test(ua)) os = 'Chromebook';\n      else if (/Macintosh/i.test(ua)) os = 'Mac 筆電';\n      else if (/Windows/i.test(ua)) os = 'Windows 筆電';\n      return { id: id, info: os };\n    }\n\n    function showBanner(msg, type) {\n      const b = document.getElementById('banner');\n      b.className = 'rounded-xl px-4 py-3 border text-sm font-medium ' +\n        (type === 'error' ? 'bg-[#fdf2f2] border-[#f8b4b4] text-[#9b1c1c]' : 'bg-[#f3f8f5] border-[#b7dcc8] text-[#1b4332]');\n      b.textContent = msg;\n      b.classList.remove('hidden');\n      b.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    }\n    function hideBanner() { document.getElementById('banner').classList.add('hidden'); }\n  <\/script>\n<\/body>\n<\/html>", "wall": "<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>畫押牆｜大螢幕<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=Roboto+Mono:wght@700&family=Roboto:wght@900&display=swap\" rel=\"stylesheet\">\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js\"><\/script>\n  <style>\n    html, body { margin: 0; height: 100%; background: #172434; overflow: hidden; }\n    body { font-family: \"Noto Sans TC\", \"PingFang TC\", \"Microsoft JhengHei\", sans-serif; -webkit-font-smoothing: antialiased; }\n    #viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }\n    /* 舞台固定 1920×1080，依視窗大小等比縮放：任何投影機都不跑版 */\n    #stage {\n      flex: none; width: 1920px; height: 1080px; position: relative; overflow: hidden;\n      background: #f6f5f2; color: #2c353d; letter-spacing: .04em;\n      background-image: radial-gradient(#e7e3da 1.4px, transparent 1.4px);\n      background-size: 34px 34px;\n    }\n\n    /* ===== 頂部 ===== */\n    .topbar {\n      position: absolute; left: 0; top: 0; width: 1920px; height: 118px; box-sizing: border-box;\n      padding: 0 48px; display: flex; align-items: center; gap: 22px;\n      background: linear-gradient(90deg, #243b53, #2b445e 55%, #334e68); color: #f5f5f4;\n    }\n    .topbar img { width: 80px; height: 80px; border-radius: 50%; background: #fff; padding: 4px; object-fit: contain; box-sizing: border-box; }\n    .topbar img { flex: none; }\n    .topbar h1 { margin: 0; font-size: 46px; font-weight: 900; letter-spacing: .1em; white-space: nowrap; flex: none; max-width: 640px; overflow: hidden; text-overflow: ellipsis; }\n    .pill { padding: 8px 24px; border-radius: 999px; background: rgba(255,255,255,.13); font-size: 26px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }\n    .live { flex: none; margin-left: auto; margin-right: 400px; display: flex; align-items: center; gap: 10px; font-size: 22px; color: #cbd5e1; white-space: nowrap; }\n    .dot { width: 14px; height: 14px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.7); animation: pulse 2s infinite; }\n    .dot.off { background: #f87171; animation: none; }\n    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6) } 70% { box-shadow: 0 0 0 14px rgba(74,222,128,0) } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0) } }\n\n    /* ===== 右側：QR ＋ 全員縮圖 ===== */\n    #side { position: absolute; right: 48px; top: 40px; width: 360px; height: 1000px; display: flex; flex-direction: column; gap: 20px; z-index: 5; }\n    .qr-card {\n      background: #fff; border-radius: 30px; padding: 24px 20px 20px; text-align: center;\n      border: 4px solid #fdeb4a; box-shadow: 0 18px 40px -12px rgba(16,42,67,.35);\n    }\n    #qr { width: 260px; height: 260px; margin: 0 auto; }\n    #qr img, #qr canvas { width: 260px !important; height: 260px !important; }\n    .qr-cap { font-size: 32px; font-weight: 900; color: #243b53; margin-top: 12px; letter-spacing: .08em; }\n    .qr-sub { font-size: 18px; color: #5b6b7a; margin-top: 2px; line-height: 1.5; }\n    .qr-tip { margin-top: 10px; font-size: 20px; color: #1b4332; background: #e3f1eb; border-radius: 12px; padding: 6px 8px; line-height: 1.45; }\n    .qr-tip b { font-weight: 900; }\n    .thumbs-card { flex: 1; background: rgba(255,255,255,.92); border-radius: 24px; padding: 18px; border: 1px solid #e7e5e4; overflow: hidden; }\n    .thumbs-title { font-size: 21px; font-weight: 700; color: #334e68; margin-bottom: 12px; display: flex; justify-content: space-between; }\n    #thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n    .thumb {\n      aspect-ratio: 4 / 3; border-radius: 10px; background: #faf9f6; border: 2px solid #e7e5e4; overflow: hidden;\n      display: flex; align-items: center; justify-content: center; text-align: center;\n      font-family: \"LXGW WenKai TC\", serif; font-size: 15px; line-height: 1.3; color: #486581; padding: 2px; box-sizing: border-box;\n      transition: border-color .3s, box-shadow .3s;\n    }\n    .thumb img { width: 100%; height: 100%; object-fit: cover; }\n    .thumb.now { border-color: #e0a100; box-shadow: 0 0 0 3px #fdeb4a; }\n    .thumb-more { grid-column: span 3; text-align: center; font-size: 18px; color: #5b6b7a; }\n\n    /* ===== 主舞台輪播 ===== */\n    #main { position: absolute; left: 48px; top: 150px; width: 1440px; height: 810px; }\n    .slide { position: absolute; inset: 0; opacity: 0; transform: scale(.985); transition: opacity .8s ease, transform .8s ease; }\n    .slide.show { opacity: 1; transform: scale(1); }\n\n    /* 邀請頁 */\n    .inv-head { font-size: 60px; font-weight: 900; color: #243b53; letter-spacing: .08em; }\n    .inv-sub { font-size: 28px; color: #486581; margin-top: 6px; }\n    .inv-sub b { color: #9e2a2b; }\n    .steps { display: flex; gap: 28px; margin-top: 34px; }\n    .step { flex: 1; display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 26px; padding: 24px 28px; border: 1px solid #e7e5e4; box-shadow: 0 8px 24px -14px rgba(16,42,67,.3); }\n    .num { flex: none; width: 92px; height: 92px; border-radius: 50%; background: #6db38d; color: #fff; font-size: 58px; font-weight: 900; display: flex; align-items: center; justify-content: center; }\n    .step-t { font-size: 34px; font-weight: 700; color: #243b53; }\n    .step-d { font-size: 24px; color: #5b6b7a; margin-top: 2px; }\n    .plus { display: inline-flex; width: 46px; height: 46px; border-radius: 50%; background: #e8eaed; color: #3c4043; align-items: center; justify-content: center; font-size: 36px; font-weight: 500; vertical-align: middle; margin: 0 4px; }\n    .code-wrap { margin-top: 38px; position: relative; background: #fff; border-radius: 34px; border: 8px solid #c2324f; padding: 34px 40px; display: flex; align-items: center; gap: 40px; box-shadow: 0 24px 50px -20px rgba(16,42,67,.4); }\n    .code-label { font-size: 44px; font-weight: 700; color: #5b6b7a; white-space: nowrap; }\n    .code { flex: 1; text-align: center; background: #fdeb4a; border-radius: 28px; padding: 6px 20px 14px; font-family: \"Roboto Mono\", monospace; font-weight: 700; font-size: 190px; line-height: 1.1; color: #111; letter-spacing: .04em; }\n    .code.empty { font-family: \"Noto Sans TC\", sans-serif; font-size: 64px; padding: 50px 20px; color: #7c653e; }\n    .inv-foot { margin-top: 24px; font-size: 24px; color: #5b6b7a; }\n\n    /* 邀請頁：團隊原本的 Classroom 截圖，代碼位置由程式即時填入 */\n    .shot { position: relative; width: 1420px; height: 810px; border-radius: 26px; overflow: hidden; box-shadow: 0 26px 56px -24px rgba(16,42,67,.45); }\n    .shot img { display: block; width: 100%; height: 100%; }\n    .shot-code {\n      position: absolute; left: 28.35%; top: 59.77%; width: 36.6%; height: 21.43%;\n      display: flex; align-items: center; justify-content: center; white-space: nowrap;\n      font-family: \"Roboto\", \"Helvetica Neue\", Arial, sans-serif; font-weight: 900; color: #111; font-size: 150px; letter-spacing: .01em;\n    }\n    .shot-code.empty { font-family: \"Noto Sans TC\", sans-serif; font-size: 54px; color: #7c653e; }\n\n    /* 作品頁 */\n    .card-slide { display: flex; align-items: center; gap: 46px; height: 100%; }\n    .paper {\n      flex: none; width: 960px; height: 720px; background: #fff; border-radius: 14px; position: relative;\n      box-shadow: 0 30px 60px -24px rgba(16,42,67,.45); transform: rotate(-1.2deg);\n      display: flex; align-items: center; justify-content: center; overflow: hidden;\n    }\n    .paper::before { content: \"\"; position: absolute; top: -14px; left: 50%; width: 180px; height: 44px; margin-left: -90px; background: rgba(253,235,74,.75); transform: rotate(2deg); z-index: 2; }\n    .paper img { width: 100%; height: 100%; object-fit: contain; }\n    .paper .wait { font-size: 40px; color: #94a3b8; }\n    .paper .big-mood { font-family: \"LXGW WenKai TC\", serif; font-weight: 700; font-size: 76px; line-height: 1.45; color: #243b53; padding: 60px 80px; text-align: center; word-break: break-word; }\n    .info { flex: 1; min-width: 0; }\n    .badge-new { display: inline-block; background: #c2410c; color: #fff; font-size: 30px; font-weight: 900; padding: 8px 24px; border-radius: 999px; margin-bottom: 26px; animation: pop .6s ease-out; }\n    @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.12); opacity: 1 } 100% { transform: scale(1) } }\n    .mood { font-family: \"LXGW WenKai TC\", serif; font-size: 46px; line-height: 1.5; color: #2c353d; word-break: break-word; }\n    .sign { font-family: \"LXGW WenKai TC\", serif; font-weight: 700; font-size: 54px; color: #243b53; margin-top: 30px; }\n    .when { font-size: 24px; color: #94a3b8; margin-top: 14px; }\n\n    /* 空白／準備中 */\n    .center { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }\n    .center .emoji { font-size: 150px; }\n    .center .t1 { font-size: 64px; font-weight: 900; color: #243b53; margin-top: 18px; letter-spacing: .08em; }\n    .center .t2 { font-size: 30px; color: #5b6b7a; margin-top: 12px; }\n    .arrow { position: absolute; right: -20px; top: -60px; font-size: 120px; animation: nudge 1.4s ease-in-out infinite; }\n    @keyframes nudge { 0%,100% { transform: translate(0,0) } 50% { transform: translate(18px,-18px) } }\ v class=\"center\">\n            <div class=\"arrow\">↗️<\/div>\n            <div class=\"emoji\">📱<\/div>\n            <div class=\"t1\">掃右上角 QR Code<\/div>\n            <div class=\"t2\">畫個笑臉、寫句心情、簽個名，成為本場第一位畫押的師長！<\/div>\n          <\/div>`;\n      }\n      return `\n        <div class=\"center\">\n          <div class=\"emoji\">⏳<\/div>\n          <div class=\"t1\">工作坊即將開始<\/div>\n          <div class=\"t2\">（主持人：請到試算表「⚙️場次」勾選目前場次）<\/div>\n        <\/div>`;\n    }\n\n    function updateInviteCode() {\n      const el = document.getElementById('codeText');\n      const code = (D.session && D.session.code) || '';\n      if (el && el.textContent.trim() !== code && code) { el.textContent = code; el.classList.remove('empty'); fitCode(); }\n    }\n\n    // 代碼長短不一：自動縮放字級，剛好塞滿黃色框\n    function fitCode() {\n      const el = document.getElementById('codeText');\n      if (!el || el.classList.contains('empty')) return;\n      el.innerHTML = '<span>' + esc(el.textContent) + '<\/span>';\n      const span = el.firstChild;\n      el.style.fontSize = '100px';\n      const w = span.offsetWidth, h = span.offsetHeight;\n      if (!w) return;\n      const size = Math.min(100 * (el.clientWidth - 40) / w, 100 * (el.clientHeight * 0.95) / h);\n      el.style.fontSize = Math.max(40, Math.floor(size)) + 'px';\n    }\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCode);\n\n    function runBar(sec) {\n      const f = document.getElementById('barFill');\n      f.style.transition = 'none';\n      f.style.width = '0';\n      void f.offsetWidth;\n      f.style.transition = 'width ' + sec + 's linear';\n      f.style.width = '100%';\n    }\n\n    // ====== 圖片：只抓還沒抓過的 ======\n    function loadImages() {\n      const need = cards.filter(c => c.img && !imgCache.has(c.id) && !imgPending.has(c.id)).map(c => c.id).slice(0, 8);\n      if (!need.length) return;\n      need.forEach(id => imgPending.add(id));\n      call('getCardImages', [need], map => {\n        need.forEach(id => imgPending.delete(id));\n        Object.keys(map || {}).forEach(id => { imgCache.set(id, map[id]); setImg(id); });\n        renderThumbs();\n        if (cards.some(c => c.img && !imgCache.has(c.id))) setTimeout(loadImages, 1500);\n      }, () => need.forEach(id => imgPending.delete(id)));\n    }\n\n    function setImg(id) {\n      const src = imgCache.get(id);\n      document.querySelectorAll('img[data-card=\"' + CSS.escape(id) + '\"]').forEach(el => { el.src = src; el.style.display = ''; });\n      document.querySelectorAll('[data-wait=\"' + CSS.escape(id) + '\"]').forEach(el => el.remove());\n    }\n\n    // ====== 右側縮圖 ======\n    function renderThumbs() {\n      const box = document.getElementById('thumbs');\n      const list = cards.slice().reverse();\n      const MAX = 18;\n      box.innerHTML = list.slice(0, MAX).map(c => {\n        const src = c.img ? imgCache.get(c.id) : null;\n        const inner = c.img ? (src ? `<img src=\"${src}\">` : '⏳') : esc(Array.from(c.mood || c.name || '🙂').slice(0, 10).join(''));\n        return `<div class=\"thumb\" data-id=\"${esc(c.id)}\">${inner}<\/div>`;\n      }).join('') + (list.length > MAX ? `<div class=\"thumb-more\">還有 ${list.length - MAX} 張…<\/div>` : '');\n      document.getElementById('thumbCount').textContent = cards.length ? cards.length + ' 張' : '';\n      highlightThumb();\n    }\n\n    function highlightThumb() {\n      const id = current && current.type === 'card' ? current.card.id : null;\n      document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('now', t.getAttribute('data-id') === id));\n    }\n\n    // ====== QR Code ======\n    function renderQr(url) {\n      if (!url || url === lastQr) return;\n      lastQr = url;\n      const el = document.getElementById('qr');\n      el.innerHTML = '';\n      if (typeof QRCode === 'undefined') {\n        el.innerHTML = '<div style=\"font-size:14px;word-break:break-all;padding-top:80px\">' + esc(url) + '<\/div>';\n        return;\n      }\n      new QRCode(el, { text: url, width: 260, height: 260, colorDark: '#102a43', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });\n    }\n\n    // ====== 其他 ======\n    function setLive(ok, msg) {\n      document.getElementById('liveDot').classList.toggle('off', !ok);\n      document.getElementById('liveText').textContent = ok ? '即時連線' : '重新連線中…';\n      if (!ok && msg) console.warn(msg);\n    }\n\n    function fmtTime(t) {\n      if (!t) return '';\n      const d = new Date(t);\n      const diff = (Date.now() - t) / 1000;\n      if (diff < 60) return '剛剛';\n      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');\n    }\n\n    function esc(s) {\n      return String(s === null || s === undefined ? '' : s)\n        .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n    }\n\n    function toast(msg) {\n      const t = document.getElementById('toast');\n      t.textContent = msg; t.style.display = 'block';\n      setTimeout(() => { t.style.display = 'none'; }, 3500);\n    }\n\n    function toggleFullscreen() {\n      try {\n        if (document.fullscreenElement) { document.exitFullscreen(); return; }\n        const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();\n        if (p && p.catch) p.catch(() => toast('請按鍵盤 F11 進入全螢幕'));\n        else if (!p) toast('請按鍵盤 F11 進入全螢幕');\n      } catch (e) { toast('請按鍵盤 F11 進入全螢幕'); }\n    }\n    document.addEventListener('keydown', e => {\n      if (e.key === 'f' || e.key === 'F') toggleFullscreen();\n      if (e.key === 'ArrowRight' || e.key === ' ') next();   // 主持人想跳下一張\n    });\n\n    poll();\n  <\/script>\n<\/body>\n<\/html>"}</script>
